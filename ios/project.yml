name: TrendlineScale
options:
  bundleIdPrefix: com.husain313
  deploymentTarget:
    iOS: "15.0"
targets:
  TrendlineScale:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Sources
      - path: www
        type: folder
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Trendline
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSHealthShareUsageDescription: Trendline reads your weight, body fat and lean mass from Apple Health so weigh-ins from your smart scale appear automatically.
        NSHealthUpdateUsageDescription: Trendline saves the weights you log to Apple Health.
        NSFaceIDUsageDescription: Trendline uses Face ID to keep your weight data private.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.husain313.trendline
        PRODUCT_NAME: TrendlineScale
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: TrendlineScale.entitlements
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "1"
