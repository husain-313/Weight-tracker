name: TrendlineScale
options:
  bundleIdPrefix: com.husain313
  deploymentTarget:
    iOS: "15.0"
targets:
  TrendlineScale:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Sources
      - path: www
        type: folder
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Trendline
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.husain313.trendline
        PRODUCT_NAME: TrendlineScale
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
