<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Trendline</title>
<style>
/* Layout: native iOS-style single column. Fixed top bar that fades in on scroll, large title in content,
   floating tab bar + add button at the bottom, bottom sheets for editing. */
:root{
  --bg:#f2f3f7; --surface:#ffffff; --surface-2:#f0f2f6; --sheet:#ffffff; --bar:rgba(242,243,247,.82);
  --line:#e2e5ec; --line-strong:#c9ced8; --fg:#10141c; --muted:#667085;
  --accent:#0f8b9a; --accent-ink:#ffffff;
  --good:#1d9a5b; --good-bg:rgba(29,154,91,.13);
  --bad:#d64532; --bad-bg:rgba(214,69,50,.12);
  --warn:#b07d10;
  --font-ui:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --surface:#1a1e26; --surface-2:#252a34; --sheet:#1c2029; --bar:rgba(14,17,22,.8);
    --line:#2c323d; --line-strong:#4a5160; --fg:#f2f4f8; --muted:#8d96a7;
    --accent:#5cc8d6; --accent-ink:#0b1216;
    --good:#3ccf86; --good-bg:rgba(60,207,134,.15);
    --bad:#ff6b5e; --bad-bg:rgba(255,107,94,.15);
    --warn:#ffc85a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#1a1e26; --surface-2:#252a34; --sheet:#1c2029; --bar:rgba(14,17,22,.8);
  --line:#2c323d; --line-strong:#4a5160; --fg:#f2f4f8; --muted:#8d96a7;
  --accent:#5cc8d6; --accent-ink:#0b1216;
  --good:#3ccf86; --good-bg:rgba(60,207,134,.15);
  --bad:#ff6b5e; --bad-bg:rgba(255,107,94,.15);
  --warn:#ffc85a;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--font-ui);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
[hidden]{display:none!important}

/* top bar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top,0px);border-bottom:.5px solid transparent;transition:background .2s,border-color .2s}
.topbar.scrolled{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--line)}
.tb-inner{height:44px;display:flex;align-items:center;justify-content:center;position:relative;max-width:680px;margin:0 auto}
.tb-title{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s}
.scrolled .tb-title{opacity:1}
.tb-actions{position:absolute;right:16px;top:4px;display:flex;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--accent)}
.icon-btn svg{width:19px;height:19px}

main{padding:calc(env(safe-area-inset-top,0px) + 44px) 16px calc(env(safe-area-inset-bottom,0px) + 112px);max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
main.enter{animation:enter .28s cubic-bezier(.2,.8,.3,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1.large{margin:2px 0 0;font-size:34px;font-weight:800;letter-spacing:-.025em;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1.large small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}

/* cards */
.card{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.card-h h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em}
.acts{display:flex;gap:6px}
.mini-btn{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.mini-btn svg{width:17px;height:17px}
.link{color:var(--accent);font-weight:600;font-size:15px}
.note{color:var(--muted);font-size:14px;margin:0;line-height:1.4}
.lbl{font-size:13px;color:var(--muted);font-weight:500}

.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.hero .big{font-size:58px;font-weight:700;line-height:1;letter-spacing:-.03em}
.hero .unit{font-size:20px;color:var(--muted);font-weight:600;margin-left:4px;font-family:var(--font-ui)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.flat{background:var(--surface-2);color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{border-radius:14px;padding:12px 4px 10px;text-align:center;background:var(--surface-2);color:var(--muted);min-width:0}
.tile .v{font-size:19px;font-weight:700;letter-spacing:-.01em}
.tile .k{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-top:3px}
.tile.good{background:var(--good-bg);color:var(--good)} .tile.bad{background:var(--bad-bg);color:var(--bad)}
@media (max-width:350px){.tiles{grid-template-columns:repeat(2,1fr)}}

.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);text-align:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chart-wrap{position:relative;margin:0 -6px}
.chart-wrap canvas{display:block;width:100%;height:240px;touch-action:pan-y}
.tip{position:absolute;top:2px;pointer-events:none;background:var(--sheet);border:.5px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translateX(-50%);box-shadow:0 4px 14px rgba(0,0,0,.15)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

.pred{border-radius:14px;background:var(--surface-2);overflow:hidden}
.pred-row{display:grid;grid-template-columns:1fr auto;gap:1px 12px;padding:12px 14px;border-bottom:.5px solid var(--line);align-items:center}
.pred-row:last-child{border-bottom:0}
.pred-row .t{font-weight:600;font-size:16px}
.pred-row .r{font-size:13px;color:var(--muted)}
.pred-row .d{grid-row:1/3;grid-column:2;text-align:right;font-weight:700;font-size:15px}
.pred-row .d small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.pred-row.hl{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.pred-row button.link{grid-row:1/3;grid-column:2}

.bar{height:12px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar > span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.row .k{color:var(--muted);font-size:15px}
.row .v{font-weight:600}
.kv{display:flex;flex-direction:column;gap:9px}
.miles{display:flex;gap:6px;flex-wrap:wrap}
.mile{font-size:12px;font-weight:600;padding:5px 9px;border-radius:9px;background:var(--surface-2);color:var(--muted)}
.mile.done{background:var(--good-bg);color:var(--good)}
.mile.next{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--fg)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rbox{background:var(--surface-2);border-radius:14px;padding:11px 12px;min-width:0}
.rbox .k{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rbox .v{font-size:20px;font-weight:700;margin-top:2px}
.rbox .s{font-size:12px;color:var(--muted)}
.spark{display:block;width:100%;height:56px}

/* logbook */
.month{padding:12px 0 2px;gap:0;overflow:hidden}
.month h3{margin:0 16px 4px;font-size:20px;font-weight:700;letter-spacing:-.015em}
.lgrid{display:grid;align-items:center;gap:6px}
.lhead{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 16px;border-bottom:.5px solid var(--line)}
.lhead span:not(:first-child),.lrow .c{text-align:right}
.swipe{position:relative;overflow:hidden;border-bottom:.5px solid var(--line)}
.swipe:last-child{border-bottom:0}
.swipe .del{position:absolute;top:0;right:0;bottom:0;width:88px;background:var(--bad);color:#fff;font-weight:700;font-size:15px;text-align:center}
.lrow{position:relative;width:100%;padding:10px 16px;background:var(--surface);transition:transform .22s ease;touch-action:pan-y}
.lrow.dragging{transition:none}
.lrow .d{display:flex;flex-direction:column;line-height:1.1}
.lrow .d b{font-size:18px;font-weight:700} .lrow .d small{font-size:11px;color:var(--muted);font-weight:500}
.lrow .w{font-size:17px;font-weight:600} .lrow .t{font-size:15px;color:var(--muted)}
.lrow .memo{display:block;font-size:13px;color:var(--muted);margin-top:4px;text-align:left}
.chip{display:inline-flex;align-items:center;gap:3px;border-radius:8px;padding:4px 8px;font-size:13px;font-weight:700;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.flat{background:var(--surface-2);color:var(--muted)}

/* grouped lists (settings, sheets) */
.group-t{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin:10px 16px -8px}
.group-f{font-size:13px;color:var(--muted);margin:-6px 16px 0;line-height:1.4}
.list{background:var(--surface);border-radius:14px;overflow:hidden}
.sheet .list{background:var(--surface-2)}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;min-height:48px;border-bottom:.5px solid var(--line);width:100%}
.item:last-child{border-bottom:0}
.item .k{font-size:17px;min-width:0}
.item .h{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.3}
.item input[type="text"],.item input:not([type]),.item select,.item input[type="time"]{background:transparent;border:0;text-align:right;font-size:17px;color:var(--muted);width:110px;padding:4px 0;font-family:var(--font-num)}
.item select{font-family:var(--font-ui);width:auto;direction:rtl}
.item input:focus{color:var(--fg);outline:none}
.item.action{color:var(--accent);justify-content:center;font-weight:500}
.item.danger{color:var(--bad);justify-content:center;font-weight:500}
.item .val{color:var(--muted);font-size:15px}
.tg{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.3,1.3,.5,1)}
.tg:checked{background:var(--good)}
.tg:checked::after{transform:translateX(20px)}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--fg)}
.footer{text-align:center;font-size:12px;color:var(--muted);margin:6px 0 0}

/* buttons */
.btn{border-radius:14px;padding:14px 16px;font-weight:600;font-size:17px;background:var(--surface-2);color:var(--fg);text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}

/* empty */
.empty{align-items:center;text-align:center;padding:36px 20px;gap:14px}
.empty .ring{width:72px;height:72px;border-radius:50%;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);display:grid;place-items:center}
.empty .ring svg{width:34px;height:34px}
.empty h2{margin:0;font-size:22px;font-weight:700}
.empty p{margin:0;color:var(--muted);max-width:32ch;font-size:15px;line-height:1.4}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:10px;align-items:center;justify-content:center;pointer-events:none}
.tabbar{pointer-events:auto;display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border:.5px solid var(--line);border-radius:26px;padding:5px;gap:2px;flex:1;max-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.tabbar button{flex:1;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:21px;font-size:11px;font-weight:600;transition:background .2s,color .2s}
.tabbar button svg{width:23px;height:23px}
.tabbar button[aria-selected="true"]{background:var(--surface-2);color:var(--accent)}
.fab{pointer-events:auto;width:62px;height:62px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.22);flex:none;transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab svg{width:28px;height:28px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .22s}
.scrim.closing{opacity:0;transition:opacity .22s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--sheet);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:6px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto;
  animation:up .34s cubic-bezier(.2,.9,.3,1);transition:transform .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line-strong);margin:4px auto 0;flex:none}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{margin:0;font-size:20px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font-size:13px;color:var(--muted);font-weight:600}
.field input{background:var(--surface-2);border:0;border-radius:12px;padding:13px 14px;font-size:17px;width:100%}
.wbig{display:flex;align-items:center;gap:10px}
.wbig input{font-family:var(--font-num);font-size:44px;font-weight:700;text-align:center;padding:12px;background:transparent;border:0;width:100%;min-width:0;outline:none}
.step{width:56px;height:56px;border-radius:50%;background:var(--surface-2);font-size:26px;font-weight:600;flex:none;color:var(--accent);display:grid;place-items:center}
.err{color:var(--bad);font-size:14px;margin:0}
.lay-row{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:.5px solid var(--line)}
.lay-row:last-child{border-bottom:0}
.lay-row .name{flex:1;font-size:17px}
.lay-row .mv{width:34px;height:34px;border-radius:10px;background:var(--surface);display:grid;place-items:center;color:var(--accent)}
.lay-row .mv:disabled{opacity:.3}
.lay-row .mv svg{width:16px;height:16px}

/* fullscreen chart */
.full{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px calc(env(safe-area-inset-bottom,0px) + 14px);gap:12px;animation:fade .2s}
.full .chart-wrap{flex:1;min-height:0;margin:0}
.full .chart-wrap canvas{height:100%}

/* celebration */
.celebrate{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:24px;animation:fade .25s}
.celebrate canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.cel-card{position:relative;background:var(--sheet);border-radius:26px;padding:28px 22px 20px;text-align:center;max-width:340px;width:100%;display:flex;flex-direction:column;gap:10px;align-items:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.cel-ring{width:76px;height:76px;border-radius:50%;background:var(--good-bg);color:var(--good);display:grid;place-items:center}
.cel-ring svg{width:38px;height:38px}
.cel-card h2{margin:4px 0 0;font-size:24px;font-weight:800}
.cel-card .num{font-size:40px;font-weight:700}
.cel-card p{margin:0 0 6px;color:var(--muted);font-size:15px}
.cel-card .btn{width:100%}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}

/* food */
.daynav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:14px;padding:6px}
.daynav button{width:40px;height:36px;border-radius:10px;color:var(--accent);font-size:22px;font-weight:600;text-align:center}
.daynav button:disabled{opacity:.3}
.daynav b{font-size:16px}
textarea.ta{width:100%;min-height:130px;background:var(--surface-2);border:0;border-radius:14px;padding:14px;font-size:17px;line-height:1.45;resize:vertical;outline:none}
.meal-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--line);width:100%}
.meal-row:last-child{border-bottom:0}
.meal-row .nm{flex:1;min-width:0}
.meal-row .nm b{display:block;font-weight:500;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal-row .nm small{color:var(--muted);font-size:12px}
.meal-row .kc{font-weight:600;font-size:15px}
.steps{display:flex;flex-direction:column;gap:10px;padding:6px 2px}
.stp{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.stp i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;background:var(--surface-2);flex:none}
.stp.run{color:var(--fg)} .stp.run i{border:2px solid var(--accent);border-right-color:transparent;background:none;animation:spin .8s linear infinite}
.stp.done{color:var(--fg)} .stp.done i{background:var(--good-bg);color:var(--good)}
.stp.skip i{background:var(--surface-2)} .stp.fail i{background:var(--bad-bg);color:var(--bad)}
@keyframes spin{to{transform:rotate(360deg)}}
.fi{display:grid;grid-template-columns:1fr 74px 52px 28px;gap:8px;align-items:center;padding:10px 0;border-bottom:.5px solid var(--line)}
.fi:last-child{border-bottom:0}
.fi .nm b{display:block;font-size:15px;font-weight:600}
.fi .nm small{display:block;color:var(--muted);font-size:12px}
.fi .warn{display:block;color:var(--warn);font-size:12px;margin-top:3px;line-height:1.3}
.fi input{width:100%;background:var(--surface-2);border:0;border-radius:9px;padding:7px 6px;text-align:right;font-family:var(--font-num);font-size:15px}
.fi .kc{text-align:right;font-weight:600;font-size:14px}
.fi .rm{width:28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--muted);display:grid;place-items:center}
.fi .rm svg{width:12px;height:12px}
.minis{display:flex;gap:6px;margin-top:6px}
.minis button{font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;background:var(--surface-2);color:var(--muted)}
.minis button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.issues{background:color-mix(in srgb,var(--warn) 14%,transparent);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4}
.sel{-webkit-user-select:text;user-select:text}
.bars{display:flex;align-items:flex-end;gap:4px;height:56px}
.bars span{flex:1;background:var(--accent);border-radius:4px 4px 2px 2px;min-height:2px;opacity:.85}
.bars span.today{opacity:.4}

<script>
"use strict";
/* ---------- state ---------- */
const KEY = "trendline-scale-v1";
const NATIVE = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.store);
const CARD_NAMES = { trend:"Trend weight", chart:"Weight chart", predict:"Predictions", goal:"Goal progress", energy:"Energy balance", activity:"Activity", fitness:"Fitness", body:"Body composition", records:"Records", bmi:"Body mass index" };
const DEFAULTS = { unit:"kg", goal:null, start:null, height:null, smooth:0.1, theme:"auto", accent:"teal", step:null, chartRange:90, reportMode:"monthly",
  healthRead:false, healthWrite:false, healthSince:null, healthFrom:null, healthIgnore:[], remind:false, remindTime:"07:30", notifyWeigh:true,
  commit:null, goalSince:null, celebrated:null, cards:null, cols:null, haptics:true, lock:false, actRead:false,
  models:{ gemini:"gemini-2.5-flash", groq:"llama-3.3-70b-versatile", claude:"claude-haiku-5-5" } };
let S = { entries:[], settings:{...DEFAULTS}, food:{}, foodCache:{}, activity:null };

function normalize(){
  const s = S.settings, known = Object.keys(CARD_NAMES);
  const cards = Array.isArray(s.cards) ? s.cards.filter(c => c && known.includes(c.id)) : [];
  for (const id of known) if (!cards.find(c => c.id === id)) cards.push({ id, on:true });
  s.cards = cards;
  s.cols = { trend:true, rate:true, ...(s.cols || {}) };
  if (!Array.isArray(s.healthIgnore)) s.healthIgnore = [];
  s.models = { ...DEFAULTS.models, ...(s.models || {}) };
  if (!S.food || typeof S.food !== "object") S.food = {};
  if (!S.foodCache || typeof S.foodCache !== "object") S.foodCache = {};
}
function load(){
  try{
    const raw = (NATIVE && typeof window.__NATIVE_STATE__ === "string") ? window.__NATIVE_STATE__ : localStorage.getItem(KEY);
    if (raw){ const d = JSON.parse(raw); S.entries = Array.isArray(d.entries) ? d.entries : []; S.settings = {...DEFAULTS, ...(d.settings || {})}; S.food = d.food || {}; S.foodCache = d.foodCache || {}; S.activity = d.activity || null; }
  }catch(e){}
  normalize(); sortEntries();
}
function save(){
  const json = JSON.stringify(S);
  if (NATIVE){ try{ window.webkit.messageHandlers.store.postMessage(json); }catch(e){} }
  try{ localStorage.setItem(KEY, json); }catch(e){}
}
function sortEntries(){ S.entries.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); }
function nativeCmd(cmd, data){ if (!NATIVE || !window.webkit.messageHandlers.native) return; try{ window.webkit.messageHandlers.native.postMessage(Object.assign({cmd}, data || {})); }catch(e){} }
function haptic(kind){ if (S.settings.haptics !== false) nativeCmd("haptic", { kind }); }

/* ---------- dates & units ---------- */
const DAY = 864e5;
const pad = n => String(n).padStart(2,"0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const dnum = s => { const [y,m,d] = s.split("-").map(Number); return Date.UTC(y,m-1,d)/DAY; };
const fromDnum = n => { const d = new Date(n*DAY); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONF = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const parts = s => { const [y,m,d] = s.split("-").map(Number); return { y, m, d, wd: new Date(Date.UTC(y,m-1,d)).getUTCDay() }; };
const fmtDate = s => { const p = parts(s); return `${p.d} ${MON[p.m-1]} ${p.y}`; };
const LB = 2.2046226218;
const U = () => S.settings.unit;
const toU = kg => U() === "lb" ? kg*LB : kg;
const fromU = v => U() === "lb" ? v/LB : v;
const fw = kg => kg == null || isNaN(kg) ? "—" : toU(kg).toFixed(1);
const fd = kg => { if (kg == null || isNaN(kg)) return "—"; const v = toU(kg); if (Math.abs(v) < 0.05) return "0.0"; return (v > 0 ? "+" : "−") + Math.abs(v).toFixed(1); };
const FONT = getComputedStyle(document.documentElement).getPropertyValue("--font-ui").trim() || "system-ui";
const NUMFONT = getComputedStyle(document.documentElement).getPropertyValue("--font-num").trim() || "system-ui";

/* ---------- the math ---------- */
// Exponentially smoothed trend that respects gaps between weigh-ins.
function computeTrend(){
  const a = S.settings.smooth; let t = null, prev = null;
  return S.entries.map(e => {
    const n = dnum(e.date);
    if (t === null) t = e.kg; else { const f = 1 - Math.pow(1 - a, Math.max(1, n - prev)); t += f * (e.kg - t); }
    prev = n; return { ...e, n, trend: t };
  });
}
function trendAt(rows, n){
  if (!rows.length || n < rows[0].n) return null;
  if (n >= rows[rows.length-1].n) return rows[rows.length-1].trend;
  for (let i = 1; i < rows.length; i++) if (rows[i].n >= n){ const A = rows[i-1], B = rows[i]; return A.trend + (n - A.n)/((B.n - A.n) || 1)*(B.trend - A.trend); }
  return null;
}
function weeklyRateAt(rows, i){
  const r = rows[i]; if (i === 0 || r.n - rows[i-1].n > 21) return null;
  const back = trendAt(rows, r.n - 7); return back === null ? null : r.trend - back;
}
// least-squares slope (kg/day) of the trend over the last `days` days
function slope(rows, days){
  if (rows.length < 2) return null;
  const end = rows[rows.length-1].n;
  const pts = rows.filter(r => r.n >= end - days);
  if (pts.length < 2 || pts[pts.length-1].n - pts[0].n < 6) return null;
  const mx = pts.reduce((s,p) => s + p.n, 0)/pts.length, my = pts.reduce((s,p) => s + p.trend, 0)/pts.length;
  let num = 0, den = 0; for (const p of pts){ num += (p.n-mx)*(p.trend-my); den += (p.n-mx)**2; }
  return den ? num/den : null;
}
// Start of the current run of weigh-ins (after the last gap of more than 60 days).
function streakStart(rows){ let i0 = 0; for (let i = 1; i < rows.length; i++) if (rows[i].n - rows[i-1].n > 60) i0 = i; return i0; }
// Change in trend over the last `days`, or null when a long gap makes the comparison meaningless.
function changeOver(rows, days){
  const last = rows[rows.length-1], target = last.n - days;
  if (rows[0].n > target) return null;
  let i0 = 0; for (let i = 0; i < rows.length; i++) if (rows[i].n <= target) i0 = i;
  for (let i = i0 + 1; i < rows.length; i++) if (rows[i].n - rows[i-1].n > 21) return null;
  const b = trendAt(rows, target); return b == null ? null : last.trend - b;
}
function startWeight(){ return S.settings.start ?? (S.entries[0] ? S.entries[0].kg : null); }
function goalDir(){ const g = S.settings.goal, st = startWeight(); if (g == null || st == null) return -1; return g < st ? -1 : 1; }
function tone(delta){ if (delta == null || Math.abs(delta) < 0.05) return "flat"; return Math.sign(delta) === goalDir() ? "good" : "bad"; }
const arrow = d => d == null || Math.abs(d) < 0.05 ? "→" : d > 0 ? "↑" : "↓";
function milestones(){
  const g = S.settings.goal, st = startWeight(); if (g == null || st == null) return [];
  const step = S.settings.step ?? (U() === "lb" ? 5/LB : 2); const dir = Math.sign(g - st) || -1; const out = [];
  for (let w = st + dir*step; (dir < 0 ? w > g + 0.01 : w < g - 0.01) && out.length < 200; w += dir*step) out.push(Math.round(w*1000)/1000);
  out.push(g); return out;
}
function compSeries(field){
  const a = S.settings.smooth; let t = null, prev = null;
  return S.entries.filter(e => typeof e[field] === "number").map(e => {
    const n = dnum(e.date);
    if (t === null) t = e[field]; else { const f = 1 - Math.pow(1 - a, Math.max(1, n - prev)); t += f * (e[field] - t); }
    prev = n; return { n, date: e.date, v: e[field], trend: t };
  });
}
function compChange(rows, days){
  if (rows.length < 2) return null;
  const last = rows[rows.length-1], target = last.n - days; let base = null;
  for (const r of rows) if (r.n <= target) base = r;
  if (!base){ if (last.n - rows[0].n < days/2) return null; base = rows[0]; }
  return last.trend - base.trend;
}
function etaFor(perDay, left, lastN){
  if (Math.abs(left) < 0.05) return { text:"Reached" };
  if (!perDay || Math.sign(perDay) !== -Math.sign(left) || Math.abs(perDay) < 0.0005) return { text:"Not on pace", off:true };
  const d = Math.round(Math.abs(left/perDay));
  return d > 3650 ? { text:"Over 10 years", off:true } : { text: fmtDate(fromDnum(lastN + d)), sub: d < 60 ? `${d} days` : `${Math.round(d/7)} weeks` };
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const view = $("#view");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ICON = {
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>',
  expand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  layout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="6" rx="2"/><rect x="4" y="14" width="16" height="6" rx="2"/></svg>',
  cols:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M9.5 4v16M14.5 4v16"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  scale:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 9.5a5 5 0 0 1 8 0M12 9.5l1.5-2"/></svg>'
};

/* ---------- theme ---------- */
const ACCENTS = { teal:["#5cc8d6","#0f8b9a"], blue:["#5aa9ff","#1d6fd8"], indigo:["#9a96ff","#5a52d6"], green:["#4fd496","#168a52"], orange:["#ffad5c","#c2660f"], pink:["#ff86b3","#c63a71"] };
function isDark(){ const t = S.settings.theme; return t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches); }
function applyTheme(){
  const root = document.documentElement, t = S.settings.theme;
  if (t === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", t);
  const a = ACCENTS[S.settings.accent] || ACCENTS.teal, dark = isDark();
  root.style.setProperty("--accent", dark ? a[0] : a[1]);
  root.style.setProperty("--accent-ink", dark ? "#0b1216" : "#ffffff");
  nativeCmd("theme", { mode: t });
}

/* ---------- native bridge ---------- */
let backupInfo = null;
window.__native = function(event, p){
  p = p || {};
  if (event === "health-samples") mergeHealth(p.samples || [], p.error);
  else if (event === "health-status"){ if (p.available === false){ S.settings.healthRead = false; S.settings.healthWrite = false; save(); toast("Apple Health is not available on this device."); if (tab === "settings") render(); } else syncHealth(true); }
  else if (event === "reminder-denied"){ S.settings.remind = false; save(); toast("Notifications are off for Trendline. Turn them on in iOS Settings."); if (tab === "settings") render(); }
  else if (event === "backup-info"){ backupInfo = p; const el = document.getElementById("bkinfo"); if (el) el.textContent = backupText(); }
  else if (event === "foreground"){ syncHealth(false); syncActivity(false); scheduleReminder(); if (tab !== "settings") render(); }
  else if (event === "toast") toast(p.text || "");
  else if (event === "http-result"){ const w = httpWait[p.id]; if (w){ delete httpWait[p.id]; p.error ? w.reject(new Error(p.error)) : w.resolve(p); } }
  else if (event === "local-ai"){ const w = localWait[p.id]; if (w){ delete localWait[p.id]; p.ok ? w.resolve(p.text || "") : w.reject(new Error(p.error || "unavailable")); } }
  else if (event === "key-status"){ const changed = JSON.stringify(p) !== JSON.stringify(keyStatus); keyStatus = p; if (changed && tab === "settings") render(); }
  else if (event === "activity"){
    if (p.error){ toast("Apple Health is not available on this device."); return; }
    S.activity = { updated: Date.now(), steps: p.steps || {}, active: p.active || {}, basal: p.basal || {}, rhr: p.rhr || {}, vo2: p.vo2 || {}, workouts: p.workouts || [] };
    save(); if (tab === "summary" || tab === "food") render();
  }
  else if (event === "barcode"){ if (p.code) onBarcode(p.code); else if (p.error === "camera-denied") toast("Allow camera access for Trendline in iOS Settings."); else if (p.error) toast("Barcode scanning isn't available on this device."); }
  else if (event === "lock-result"){
    if (p.ok){ S.settings.lock = !!p.enabled; save(); toast(p.enabled ? "Face ID lock is on" : "Face ID lock is off"); haptic("success"); }
    else toast(p.reason === "unavailable" ? "Set up Face ID or a passcode on this iPhone first." : "Face ID was not confirmed.");
    if (tab === "settings") render();
  }
  else if (event === "state"){
    try{
      const d = JSON.parse(p.json);
      if (d && Array.isArray(d.entries) && JSON.stringify(d) !== JSON.stringify(S)){
        S.entries = d.entries; S.settings = {...DEFAULTS, ...(d.settings || {})}; S.food = d.food || S.food; S.foodCache = d.foodCache || S.foodCache; S.activity = d.activity || S.activity; normalize(); sortEntries();
        if (!document.querySelector(".scrim")) render();
        checkCelebrate(false);
      }
    }catch(e){}
  }
};
function backupText(){
  if (!backupInfo || !backupInfo.last) return "No automatic backup yet. One is saved the next time something changes.";
  const d = new Date(backupInfo.last);
  return `Last saved ${d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}, ${d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})} · ${backupInfo.count} weekly cop${backupInfo.count === 1 ? "y" : "ies"} kept`;
}
function syncHealth(full){
  if (!NATIVE || !S.settings.healthRead) return;
  let since = (!full && S.settings.healthSince) ? fromDnum(dnum(S.settings.healthSince) - 7) : "2000-01-01";
  if (S.settings.healthFrom && since < S.settings.healthFrom) since = S.settings.healthFrom;
  nativeCmd("healthRead", { since });
}
function mergeHealth(samples, error){
  if (error){ toast("Could not read from Apple Health."); return; }
  const ignore = new Set(S.settings.healthIgnore || []);
  let added = 0, changed = 0;
  for (const smp of samples){
    if (!smp || !smp.date || ignore.has(smp.date) || (S.settings.healthFrom && smp.date < S.settings.healthFrom)) continue;
    const hasKg = smp.kg > 20 && smp.kg < 400;
    let ex = S.entries.find(e => e.date === smp.date);
    if (!ex){ if (!hasKg) continue; ex = { id: "h" + smp.date, date: smp.date, kg: smp.kg, note: "", src: "health" }; S.entries.push(ex); added++; }
    else if (hasKg && ex.src === "health" && Math.abs(ex.kg - smp.kg) > 0.005){ ex.kg = smp.kg; changed++; }
    if (smp.fat > 1 && smp.fat < 75 && ex.fat !== smp.fat){ ex.fat = smp.fat; changed++; }
    if (smp.lean > 10 && smp.lean < 200 && ex.lean !== smp.lean){ ex.lean = smp.lean; changed++; }
  }
  S.settings.healthSince = todayStr();
  sortEntries(); save();
  if (added || changed){
    render(); scheduleReminder();
    if (added) toast(`Added ${added} weigh-in${added > 1 ? "s" : ""} from Apple Health`);
    checkCelebrate(added > 3);
  } else if (tab === "settings") render();
}
function scheduleReminder(){
  if (!NATIVE) return;
  const [h, m] = (S.settings.remindTime || "07:30").split(":").map(Number);
  let body = "Step on the scale before breakfast.";
  if (S.entries.length){ const r = computeTrend(); body = `Your trend is ${fw(r[r.length-1].trend)} ${U()}. Step on the scale before breakfast.`; }
  nativeCmd("reminder", { enabled: !!S.settings.remind, hour: isNaN(h) ? 7 : h, minute: isNaN(m) ? 30 : m, weighedToday: S.entries.some(e => e.date === todayStr()), body });
}
function connectHealth(){
  S.settings.healthRead = true; if (!S.settings.healthFrom) S.settings.healthFrom = todayStr(); save();
  nativeCmd("healthAuthorize", { write: S.settings.healthWrite });
  if (S.settings.notifyWeigh !== false) nativeCmd("notifyAuth");
  toast("Checking Apple Health…");
}

/* ---------- celebrations ---------- */
function reachedMilestones(){
  if (!S.entries.length) return [];
  const rows = computeTrend(), t = rows[rows.length-1].trend, dir = goalDir();
  return milestones().filter(m => dir < 0 ? t <= m + 0.001 : t >= m - 0.001);
}
function checkCelebrate(silent){
  if (S.settings.goal == null || !S.entries.length) return;
  const reached = reachedMilestones();
  const done = new Set((S.settings.celebrated || []).map(x => Number(x).toFixed(2)));
  const fresh = reached.filter(m => !done.has(m.toFixed(2)));
  if (S.settings.celebrated == null) silent = true;
  if (!fresh.length){ if (S.settings.celebrated == null){ S.settings.celebrated = []; save(); } return; }
  S.settings.celebrated = [...(S.settings.celebrated || []), ...fresh]; save();
  if (silent) return;
  const best = fresh[fresh.length-1], isGoal = Math.abs(best - S.settings.goal) < 0.01;
  showCelebration(isGoal, best);
}
function resetCelebrations(){ S.settings.celebrated = null; checkCelebrate(true); }
function showCelebration(isGoal, value){
  haptic("success");
  const el = document.createElement("div"); el.className = "celebrate";
  const dir = goalDir() < 0 ? "below" : "above";
  el.innerHTML = `<canvas></canvas><div class="cel-card" role="dialog" aria-modal="true">
    <div class="cel-ring">${isGoal ? ICON.flag : ICON.check}</div>
    <h2>${isGoal ? "Goal reached" : "Milestone reached"}</h2>
    <div class="num">${fw(value)} <span style="font-size:20px;color:var(--muted)">${U()}</span></div>
    <p>${isGoal ? "Your trend weight hit your goal. Time to set the next one." : `Your trend weight is now ${dir} ${fw(value)} ${U()}.`}</p>

function http(req){

    const id = ++httpSeq; httpWait[id] = { resolve, reject };

  });

function parseJSON(t){
  if (!t) return null; t = String(t).replace(/```(?:json)?/g, "");
  const a = t.indexOf("{"), b = t.lastIndexOf("}"); if (a < 0 || b <= a) return null;
  try{ return JSON.parse(t.slice(a, b + 1)); }catch(e){ return null; }
}

async function lookupItem(it){

  if (hit){ it.per100 = { kcal: hit[2], p: hit[3], c: hit[4], f: hit[5] }; it.src = "Built-in"; it.match = hit[1]; return; }
  if (S.foodCache[n]){ Object.assign(it, S.foodCache[n]); return; }
  if (keyStatus.usda){ try{ const r = await usdaSearch(n); if (r){ it.per100 = r.per100; it.src = "USDA"; it.match = r.name; S.foodCache[n] = { per100: r.per100, src: "USDA", match: r.name }; return; } }catch(e){} }

// The pipeline: understand (Claude or Gemini, Apple offline) → review (Groq) → values (built-in, USDA) → totals (here).
async function analyzeFood(text, step){
  const parsers = [];
  if (keyStatus.claude) parsers.push(["Claude", callClaude]);
  if (keyStatus.gemini) parsers.push(["Gemini", callGemini]);
  if (keyStatus.local) parsers.push(["Apple Intelligence", (a, b) => localAI(a, b)]);
  if (!parsers.length) throw new Error("Add a free Gemini key in Settings › Food & AI to analyse meals.");
  let parsed = null, by = null; const errs = [];
  for (const [name, fn] of parsers){
    step(0, "run", `Understanding your meals · ${name}`);
    try{ const j = parseJSON(await fn(PARSE_SYS, `Food diary:\n${text}`)); const items = cleanItems(j && j.items); if (items.length){ parsed = { translation: j.translation || "", items }; by = name; break; } errs.push(`${name}: no foods found`); }
    catch(e){ errs.push(e.message); }
  }
  if (!parsed){ step(0, "fail", "Couldn't understand the meals"); throw new Error(errs.join(" · ")); }
  step(0, "done", `Understood · ${by}`);
  const reviewers = [];
  if (keyStatus.groq) reviewers.push(["Groq", callGroq]);
  if (keyStatus.gemini && by !== "Gemini") reviewers.push(["Gemini", callGemini]);
  let items = parsed.items, issues = [], rby = null;
  if (!reviewers.length) step(1, "skip", "Checking · add a Groq key for a second opinion");
  for (const [name, fn] of reviewers){
    step(1, "run", `Checking the result · ${name}`);
    try{
      const j = parseJSON(await fn(REVIEW_SYS, JSON.stringify({ diary: text, translation: parsed.translation, items: parsed.items })));
      const fixed = cleanItems(j && j.items);
      if (fixed.length){ items = fixed; issues = (j.issues || []).map(String).slice(0, 6); rby = name; break; }
    }catch(e){ errs.push(e.message); }
  }
  if (reviewers.length) step(1, rby ? "done" : "fail", rby ? (issues.length ? `Checked · ${rby} fixed ${issues.length} thing${issues.length > 1 ? "s" : ""}` : `Checked · ${rby} found no problems`) : "Check skipped · service didn't answer");
  step(2, "run", "Looking up nutrition values");
  for (const it of items) await lookupItem(it);
  save();
  const srcs = [...new Set(items.map(i => i.src).filter(Boolean))];
  step(2, "done", `Values · ${srcs.join(", ") || "none found"}`);
  step(3, "done", "Totals calculated");
  return { items, translation: parsed.translation, issues, by, rby };

function reviewFood(res, text){

      html += `<div><div class="lbl" style="font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px">${label}</div>`;

        html += `<div class="fi"><div class="nm"><b>${esc(it.nameAr || it.name)}</b><small>${esc(it.match || it.name)}${it.src ? " · " + esc(it.src) : ""}</small>

          <label><input data-g="${i}" inputmode="decimal" value="${it.grams}" aria-label="Grams"><small style="display:block;text-align:right;color:var(--muted);font-size:11px">grams</small></label>
          <span class="kc num" id="kc${i}">${kc == null ? "—" : k(kc)}</span>
          <button class="rm" data-rm="${i}" aria-label="Remove">${ICON.close}</button></div>`;
      }
      html += `</div>`;
    }
    html += `<div class="row" style="padding-top:4px"><span class="k">Total</span><span class="v num" id="ftot">${k(t.kcal)} kcal · P ${Math.round(t.p)} · C ${Math.round(t.c)} · F ${Math.round(t.f)}</span></div>
      <button class="btn primary" id="fsave" ${items.length ? "" : "disabled"}>Save to ${dayLabel(foodDay)}</button>

    sh.innerHTML = `<div class="grab"></div>` + html;
    bind();
  };
  const sh = document.querySelector(".scrim:not(.closing) .sheet");
  const totals = () => { const t = dayTotals(items); const el = sh.querySelector("#ftot"); if (el) el.textContent = `${Math.round(t.kcal).toLocaleString("en-US")} kcal · P ${Math.round(t.p)} · C ${Math.round(t.c)} · F ${Math.round(t.f)}`; };
  const bind = () => {
    sh.querySelectorAll("[data-x]").forEach(b => b.onclick = closeSheet);
    sh.querySelectorAll("[data-g]").forEach(inp => inp.oninput = () => { const i = +inp.dataset.g, v = parseFloat(inp.value.replace(",", ".")); if (!isNaN(v) && v >= 0){ items[i].grams = Math.round(v); const kc = itemKcal(items[i]); sh.querySelector("#kc" + i).textContent = kc == null ? "—" : Math.round(kc).toLocaleString("en-US"); totals(); } });

async function onBarcode(code){
  toast("Looking up product…");
  try{
    const r = await http({ url: `https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,nutriments,serving_quantity`, headers: { "User-Agent": "Trendline/1.4 (personal iOS app)" } });
    const d = JSON.parse(r.body || "{}");
    if (d.status !== 1 || !d.product){ toast("Product not found. Log it by text instead."); return; }
    const n = d.product.nutriments || {};
    const kcal = n["energy-kcal_100g"] != null ? +n["energy-kcal_100g"] : (n["energy_100g"] != null ? n["energy_100g"]/4.184 : null);
    if (kcal == null){ toast("This product has no nutrition info."); return; }
    const name = [d.product.brands, d.product.product_name].filter(Boolean).join(" · ") || `Product ${code}`;
    const h = new Date().getHours(), meal = h < 11 ? "breakfast" : h < 16 ? "lunch" : h < 21 ? "dinner" : "snack";
    const per100 = { kcal: Math.round(kcal*10)/10, p: +(n.proteins_100g || 0), c: +(n.carbohydrates_100g || 0), f: +(n.fat_100g || 0) };
    const sh = openSheet(`<div class="sheet-h"><button class="link" data-x>Cancel</button><h2>Add product</h2><span style="width:52px"></span></div>
      <p class="note"><b style="color:var(--fg)">${esc(name)}</b><br>${Math.round(per100.kcal)} kcal per 100 g · P ${per100.p} · C ${per100.c} · F ${per100.f} · Open Food Facts</p>
      <div class="wbig"><input id="bg" inputmode="decimal" value="${Math.round(+d.product.serving_quantity || 100)}" aria-label="Grams"></div>
      <div style="text-align:center;color:var(--muted);margin-top:-10px;font-weight:600">grams</div>
      <div class="seg" id="bm">${MEALS.map(([m, l]) => `<button data-m="${m}" aria-pressed="${meal === m}">${l}</button>`).join("")}</div>
      <button class="btn primary" id="bs">Add to ${dayLabel(foodDay)}</button>`);
    let mm = meal;
    sh.querySelectorAll("#bm button").forEach(b => b.onclick = () => { mm = b.dataset.m; sh.querySelectorAll("#bm button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); haptic("selection"); });
    sh.querySelector("#bs").onclick = () => { const g = parseFloat(sh.querySelector("#bg").value.replace(",", ".")); if (isNaN(g) || g <= 0) return;
      (S.food[foodDay] || (S.food[foodDay] = [])).push({ id: Date.now().toString(36), meal: mm, name, nameAr: "", grams: Math.round(g), per100, src: "Open Food Facts", match: name });
      save(); closeSheet(); haptic("success"); if (tab !== "food") setTab("food"); else render(); toast("Added"); };
  }catch(e){ toast("Couldn't reach Open Food Facts."); }
}

    <div class="list" style="margin-top:8px"><button class="item danger" id="bd">Erase all data</button></div>
    <p class="footer">Trendline${window.__APP_VERSION__ ? " " + esc(window.__APP_VERSION__) : ""}</p>`;
  view.innerHTML = html;

  const num = (id, cb) => $(id).addEventListener("change", e => { const raw = e.target.value.trim().replace(",", "."), v = raw === "" ? null : parseFloat(raw); if (raw !== "" && (isNaN(v) || v <= 0)){ toast("Enter a number above zero"); return; } cb(v); save(); haptic("light"); toast("Saved"); });
  num("#sg", v => setGoal(v == null ? null : fromU(v)));
  num("#ss", v => { S.settings.start = v == null ? null : fromU(v); resetCelebrations(); });
  num("#sm", v => { S.settings.step = v == null ? null : fromU(v); resetCelebrations(); });
  num("#sc", v => S.settings.commit = v == null ? null : fromU(v));
  num("#sh", v => S.settings.height = v);
  $("#su").onchange = e => { S.settings.unit = e.target.value; save(); haptic("light"); render(); };
  $("#sa").onchange = e => { S.settings.smooth = parseFloat(e.target.value); save(); resetCelebrations(); haptic("light"); };
  $("#st").onchange = e => { S.settings.theme = e.target.value; save(); applyTheme(); render(); };
  document.querySelectorAll("[data-acc]").forEach(b => b.onclick = () => { S.settings.accent = b.dataset.acc; save(); haptic("selection"); applyTheme(); render(); });
  $("#bx").onclick = () => exportFile(`trendline-backup-${todayStr()}.json`, JSON.stringify(S, null, 1), "application/json");
  $("#bc").onclick = () => { const rows = computeTrend(); exportFile(`trendline-${todayStr()}.csv`, "Date,Weight (kg),Trend (kg),Body fat (%),Lean mass (kg),Note\n" + rows.map(r => `${r.date},${r.kg.toFixed(2)},${r.trend.toFixed(2)},${typeof r.fat === "number" ? r.fat.toFixed(1) : ""},${typeof r.lean === "number" ? r.lean.toFixed(2) : ""},"${(r.note || "").replace(/"/g, '""')}"`).join("\n"), "text/csv"); };
  $("#bi").onclick = pickRestore;
  const bd = $("#bd"); let armed = false;
  bd.onclick = () => { if (!armed){ armed = true; bd.textContent = "Tap again to erase everything"; haptic("warning"); return; }
    const keepLock = S.settings.lock; S = { entries:[], settings:{...DEFAULTS, lock: keepLock}, food:{}, foodCache:{}, activity:null }; normalize(); save(); applyTheme(); scheduleReminder(); render(); toast("All data erased"); };
  if (NATIVE){
    $("#hr").onchange = e => { if (e.target.checked) connectHealth(); else { S.settings.healthRead = false; save(); } haptic("light"); render(); };
    $("#aw").onchange = e => { if (e.target.checked) enableActivity(); else { S.settings.actRead = false; save(); haptic("light"); } };
    document.querySelectorAll("[data-key]").forEach(b => b.onclick = () => openKeySheet(b.dataset.key));
    [["#mg","gemini"],["#mq","groq"],["#mc","claude"]].forEach(([id, k]) => $(id).onchange = e => { const v = e.target.value.trim(); S.settings.models[k] = v || DEFAULTS.models[k]; save(); toast("Saved"); });
    $("#hw").onchange = e => { S.settings.healthWrite = e.target.checked; save(); haptic("light"); if (e.target.checked) nativeCmd("healthAuthorize", { write: true }); };
    const hn = $("#hn"); if (hn) hn.onchange = e => { S.settings.notifyWeigh = e.target.checked; save(); haptic("light"); if (e.target.checked) nativeCmd("notifyAuth"); };
    const hf = $("#hf"); if (hf) hf.onchange = e => {
      const v = e.target.value; if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
      const older = S.settings.healthFrom && v < S.settings.healthFrom;
      S.settings.healthFrom = v;
      const before = S.entries.length; S.entries = S.entries.filter(x => !(x.src === "health" && x.date < v)); const removed = before - S.entries.length;
      S.settings.healthIgnore = S.settings.healthIgnore.filter(d => d >= v);
      save(); haptic("light"); resetCelebrations(); render();
      if (older) syncHealth(true);
      toast(removed ? `Removed ${removed} older Apple Health weigh-in${removed > 1 ? "s" : ""}` : `Importing from ${fmtDate(v)}`);
    };
    const hs = $("#hs"); if (hs) hs.onclick = () => { syncHealth(true); toast("Checking Apple Health…"); };
    $("#rm").onchange = e => { S.settings.remind = e.target.checked; save(); haptic("light"); scheduleReminder(); render(); if (e.target.checked) toast(`Reminder set for ${S.settings.remindTime}`); };
    $("#rt").onchange = e => { if (!e.target.value) return; S.settings.remindTime = e.target.value; save(); scheduleReminder(); toast(`Reminder set for ${e.target.value}`); };
    $("#hp").onchange = e => { S.settings.haptics = e.target.checked; save(); haptic("light"); };
    $("#lk").onchange = e => { const want = e.target.checked; e.target.checked = S.settings.lock; nativeCmd("lockSet", { enabled: want }); };
    nativeCmd("backupInfo");
    nativeCmd("keyStatus");
  }
}
function exportFile(name, text, type){
  haptic("light");
  if (NATIVE && window.webkit.messageHandlers.share){ window.webkit.messageHandlers.share.postMessage({ name, text }); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function pickRestore(){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async () => { const f = inp.files[0]; if (!f) return; restoreBackup(await f.text()); };
  inp.click();
}
function restoreBackup(text){
  let d; try{ d = JSON.parse(text); }catch(e){ d = null; }
  if (!d || !Array.isArray(d.entries)){ toast("That file isn't a Trendline backup."); haptic("warning"); return; }
  let added = 0, updated = 0;
  for (const e of d.entries){
    if (!e || !/^\d{4}-\d{2}-\d{2}$/.test(e.date) || !(e.kg > 20 && e.kg < 400)) continue;
    const ex = S.entries.find(x => x.date === e.date);
    if (ex){ Object.assign(ex, e, { id: ex.id }); updated++; } else { S.entries.push({ ...e, id: e.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 7) }); added++; }
  }
  if (d.settings){ const keep = { lock: S.settings.lock }; S.settings = { ...DEFAULTS, ...d.settings, ...keep }; }
  if (d.food && typeof d.food === "object") for (const [day, list] of Object.entries(d.food)) if (Array.isArray(list) && !S.food[day]) S.food[day] = list;
  normalize(); sortEntries(); save(); applyTheme(); scheduleReminder(); checkCelebrate(true); render(); haptic("success");
  toast(`Restored: ${added} new, ${updated} updated`);
}
function loadDemo(){
  const end = dnum(todayStr()); let w = 86;
  for (let i = 120; i >= 0; i--){ if (Math.random() < 0.15) continue; w += -0.06 + (Math.random() - .5)*0.15; const noise = (Math.random() - .5)*1.2;
    S.entries.push({ id: "demo" + i, date: fromDnum(end - i), kg: Math.round((w + noise)*10)/10, note: i === 60 ? "Demo data" : "", fat: Math.round((25 - (120 - i)*0.02 + (Math.random() - .5))*10)/10 }); }
  S.settings.goal = 78; S.settings.goalSince = fromDnum(end - 120); S.settings.commit = 0.5;
  sortEntries(); resetCelebrations(); save(); render(true); toast("Demo data loaded. Erase it in Settings.");
}

/* ---------- toast ---------- */
let toastT;
function toast(msg, action){
  let t = $(".toast"); if (!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ""}`; t.hidden = false;
  if (action) t.querySelector("button").onclick = () => { t.hidden = true; action.fn(); };
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, action ? 4500 : 2600);
}

/* ---------- boot ---------- */
load(); applyTheme();
document.querySelectorAll(".tabbar button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
render();
if (NATIVE){ syncHealth(false); syncActivity(true); scheduleReminder(); nativeCmd("keyStatus"); }
checkCelebrate(S.settings.celebrated == null);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { applyTheme(); render(); });
</script>
</body>
