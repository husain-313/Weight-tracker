<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Trendline</title>
<style>
/* Layout: one calm column. Fixed top bar that fades in on scroll, two tabs with the add button
   between them, settings as its own page, bottom sheets for editing.
   Palette "sand and sage": sage for the trend, terracotta for the goal and milestones. */
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#efece5; --sheet:#ffffff; --bar:rgba(246,244,239,.86);
  --line:#e4e0d7; --line-strong:#cfcac0; --fg:#1f2623; --muted:#6f756f;
  --trend:#4f7f6a; --trend-ink:#ffffff; --trend-soft:rgba(79,127,106,.13);
  --goal:#c8754b; --goal-soft:rgba(200,117,75,.14);
  --dot:#b9bdb6; --danger:#b5534a; --danger-soft:rgba(181,83,74,.12);
  --font-ui:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121513; --surface:#1c201d; --surface-2:#262b27; --sheet:#1e221f; --bar:rgba(18,21,19,.86);
    --line:#2e342f; --line-strong:#454c46; --fg:#eceeea; --muted:#949b94;
    --trend:#8dbfa5; --trend-ink:#0f1411; --trend-soft:rgba(141,191,165,.15);
    --goal:#e39a73; --goal-soft:rgba(227,154,115,.15);
    --dot:#4a504b; --danger:#e07a6e; --danger-soft:rgba(224,122,110,.15);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121513; --surface:#1c201d; --surface-2:#262b27; --sheet:#1e221f; --bar:rgba(18,21,19,.86);
  --line:#2e342f; --line-strong:#454c46; --fg:#eceeea; --muted:#949b94;
  --trend:#8dbfa5; --trend-ink:#0f1411; --trend-soft:rgba(141,191,165,.15);
  --goal:#e39a73; --goal-soft:rgba(227,154,115,.15);
  --dot:#4a504b; --danger:#e07a6e; --danger-soft:rgba(224,122,110,.15);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--font-ui);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--trend);outline-offset:2px}
svg{display:block}
[hidden]{display:none!important}

/* top bar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top,0px);border-bottom:.5px solid transparent;transition:background .2s,border-color .2s}
.topbar.scrolled{background:var(--bar);-webkit-backdrop-filter:saturate(160%) blur(20px);backdrop-filter:saturate(160%) blur(20px);border-bottom-color:var(--line)}
.tb-inner{height:44px;display:flex;align-items:center;justify-content:center;position:relative;max-width:640px;margin:0 auto}
.tb-title{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s}
.scrolled .tb-title{opacity:1}
.tb-left{position:absolute;left:16px;top:0;height:44px;display:flex;align-items:center}
.tb-right{position:absolute;right:16px;top:4px;display:flex;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--muted)}
.icon-btn svg{width:19px;height:19px}

main{padding:calc(env(safe-area-inset-top,0px) + 48px) 16px calc(env(safe-area-inset-bottom,0px) + 116px);max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
body[data-tab="settings"] main{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px)}
main.enter{animation:enter .28s cubic-bezier(.2,.8,.3,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1.large{margin:2px 0 0;font-size:34px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1.large small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}
.dateline{margin:2px 0 -6px;font-size:15px;font-weight:500;color:var(--muted)}

/* cards */
.card{background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.card-h h2{margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em}
.mini-btn{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.mini-btn svg{width:16px;height:16px}
.link{color:var(--trend);font-weight:600;font-size:16px}
.link.strong{font-weight:700}
.note{color:var(--muted);font-size:14px;margin:0;line-height:1.45}
.lbl{font-size:13px;color:var(--muted);font-weight:500}
.good{color:var(--trend)} .bad,.flat{color:var(--muted)}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:18px 0 6px}
.hero .big{font-size:68px;font-weight:700;line-height:1;letter-spacing:-.035em}
.hero .unit{font-size:22px;color:var(--muted);font-weight:600;margin-left:6px;letter-spacing:0;font-family:var(--font-ui)}
.chg{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:6px 12px;font-size:15px;font-weight:650;background:var(--surface-2)}
.chg.good{background:var(--trend-soft)}
.hero .sub{font-size:14px;color:var(--muted)}

/* chart */
.chart-card{padding:14px 12px 12px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);text-align:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chart-wrap{position:relative}
.chart-wrap canvas{display:block;width:100%;height:250px;touch-action:pan-y}
.tip{position:absolute;top:0;pointer-events:none;background:var(--sheet);border:.5px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translateX(-50%);box-shadow:0 4px 14px rgba(0,0,0,.12)}

/* goal */
.gbar{position:relative;height:10px;background:var(--surface-2);border-radius:999px;margin:6px 0 2px}
.gbar > span{position:absolute;left:0;top:0;bottom:0;background:var(--goal);border-radius:999px;transition:width .5s}
.gbar .mk{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--goal)}
.gbar .mk.on{background:var(--goal);box-shadow:0 0 0 2px var(--surface)}
.gends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.gline{font-size:22px;font-weight:700;letter-spacing:-.01em}
.gline small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}

/* prediction */
.pred-big{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.pred-big.muted{color:var(--muted);font-size:22px}
.pred-alt{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-top:.5px solid var(--line);padding-top:12px;font-size:15px}
.pred-alt span{color:var(--muted)}
.pred-alt b{font-weight:650;white-space:nowrap}

/* history */
.month{padding:14px 0 4px;gap:0;overflow:hidden}
.month-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 16px 6px}
.month-h h3{margin:0;font-size:19px;font-weight:650}
.month-h span{font-size:14px;font-weight:600}
.hgrid{display:grid;grid-template-columns:46px 1fr 70px 64px;align-items:center;gap:6px}
.hhead{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:4px 16px 6px;border-bottom:.5px solid var(--line)}
.hhead span:nth-child(n+3),.lrow .c{text-align:right}
.swipe{position:relative;overflow:hidden;border-bottom:.5px solid var(--line)}
.swipe:last-child{border-bottom:0}
.swipe .del{position:absolute;top:0;right:0;bottom:0;width:88px;background:var(--danger);color:#fff;font-weight:650;font-size:15px;text-align:center}
.lrow{position:relative;width:100%;padding:11px 16px;background:var(--surface);transition:transform .22s ease;touch-action:pan-y}
.lrow.dragging{transition:none}
.lrow .d{display:flex;flex-direction:column;line-height:1.1}
.lrow .d b{font-size:18px;font-weight:650} .lrow .d small{font-size:11px;color:var(--muted);font-weight:500}
.lrow .w{font-size:17px;font-weight:600;display:flex;align-items:center;gap:5px}
.lrow .w svg{width:13px;height:13px;color:var(--goal);flex:none}
.lrow .df{font-size:14px;font-weight:600}
.lrow .t{font-size:15px;color:var(--muted)}
.lrow .memo{grid-column:1/-1;font-size:13px;color:var(--muted);text-align:left;margin-top:-2px}
.lrow.out .w{color:var(--muted);text-decoration:line-through}

/* grouped lists (settings, sheets) */
.group-t{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin:10px 16px -10px}
.group-f{font-size:13px;color:var(--muted);margin:-8px 16px 0;line-height:1.4}
.list{background:var(--surface);border-radius:14px;overflow:hidden}
.sheet .list{background:var(--surface-2)}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;min-height:48px;border-bottom:.5px solid var(--line);width:100%}
.item:last-child{border-bottom:0}
.item .k{font-size:17px;min-width:0}
.item .h{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.3}
.item input[type="text"],.item input:not([type]),.item select,.item input[type="time"],.item input[type="date"]{background:transparent;border:0;text-align:right;font-size:17px;color:var(--muted);width:120px;padding:4px 0;font-family:var(--font-num)}
.item input[type="date"]{color:var(--trend);width:auto}
.item select{font-family:var(--font-ui);width:auto;direction:rtl}
.item input:focus{color:var(--fg);outline:none}
.item.action{color:var(--trend);justify-content:center;font-weight:500}
.item.danger{color:var(--danger);justify-content:center;font-weight:500}
.item .val{color:var(--muted);font-size:15px;text-align:right}
.tg{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.3,1.3,.5,1)}
.tg:checked{background:var(--trend)}
.tg:checked::after{transform:translateX(20px)}
.footer{text-align:center;font-size:12px;color:var(--muted);margin:6px 0 0}

/* buttons */
.btn{border-radius:14px;padding:14px 16px;font-weight:600;font-size:17px;background:var(--surface-2);color:var(--fg);text-align:center}
.btn.primary{background:var(--trend);color:var(--trend-ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}
.empty .btns .btn{flex:none}

/* empty */
.empty{align-items:center;text-align:center;padding:40px 20px;gap:14px}
.empty .ring{width:72px;height:72px;border-radius:50%;background:var(--trend-soft);color:var(--trend);display:grid;place-items:center}
.empty .ring svg{width:34px;height:34px}
.empty h2{margin:0;font-size:22px;font-weight:700}
.empty p{margin:0;color:var(--muted);max-width:32ch;font-size:15px;line-height:1.45}

/* tab bar: two tabs with the add button between them */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;justify-content:center;pointer-events:none}
body[data-tab="settings"] nav.tabs{display:none}
.tabbar{pointer-events:auto;display:flex;align-items:center;background:var(--bar);-webkit-backdrop-filter:saturate(160%) blur(20px);backdrop-filter:saturate(160%) blur(20px);
  border:.5px solid var(--line);border-radius:30px;padding:5px;width:100%;max-width:330px;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.tabbar [role="tab"]{flex:1;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:24px;font-size:11px;font-weight:600;transition:background .2s,color .2s}
.tabbar [role="tab"] svg{width:23px;height:23px}
.tabbar [role="tab"][aria-selected="true"]{color:var(--trend)}
.fab{flex:none;width:60px;height:60px;margin:-20px 10px;border-radius:50%;background:var(--trend);color:var(--trend-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.18);transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab svg{width:28px;height:28px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .22s}
.scrim.closing{opacity:0;transition:opacity .22s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--sheet);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:6px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto;
  animation:up .34s cubic-bezier(.2,.9,.3,1);transition:transform .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line-strong);margin:4px auto 0;flex:none}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{margin:0;font-size:18px;font-weight:650}
.wbig input{font-family:var(--font-num);font-size:44px;font-weight:700;text-align:center;padding:12px;background:transparent;border:0;width:100%;min-width:0;outline:none}
.dial{display:flex;align-items:center;gap:10px;padding-top:6px}
.dial-mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.dial-mid input{font-family:var(--font-num);font-size:58px;font-weight:700;letter-spacing:-.03em;text-align:center;padding:4px 0;background:transparent;border:0;width:100%;min-width:0;outline:none;touch-action:none;caret-color:var(--trend)}
.dial-u{font-size:15px;font-weight:600;color:var(--muted);margin-top:-4px}
.step{width:56px;height:56px;border-radius:50%;background:var(--surface-2);font-size:28px;font-weight:500;flex:none;color:var(--trend);display:grid;place-items:center}
.step:active{background:var(--trend-soft)}
.hint{margin:-6px 0 0;text-align:center;font-size:13px;color:var(--muted)}
.err{color:var(--danger);font-size:14px;margin:0}

/* celebration */
.celebrate{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:24px;animation:fade .25s}
.celebrate canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.cel-card{position:relative;background:var(--sheet);border-radius:26px;padding:28px 22px 20px;text-align:center;max-width:340px;width:100%;display:flex;flex-direction:column;gap:10px;align-items:center;animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
.cel-ring{width:72px;height:72px;border-radius:50%;background:var(--goal-soft);color:var(--goal);display:grid;place-items:center}
.cel-ring svg{width:34px;height:34px}
.cel-card h2{margin:4px 0 0;font-size:23px;font-weight:700}
.cel-card .num{font-size:40px;font-weight:700}
.cel-card p{margin:0 0 6px;color:var(--muted);font-size:15px}
.cel-card .btn{width:100%}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.sel{-webkit-user-select:text;user-select:text}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:15px;z-index:70;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast button{color:var(--trend);font-weight:700}
@media (prefers-reduced-motion:reduce){main.enter,.sheet,.cel-card,.scrim,.celebrate{animation:none}.lrow,.gbar>span,.tg::after{transition:none}}
</style>
</head>
<body data-tab="progress">
<div class="topbar" id="topbar"><div class="tb-inner"><div class="tb-left" id="tbLeft"></div><span class="tb-title" id="tbTitle">Progress</span><div class="tb-right" id="tbRight"></div></div></div>
<main id="view"></main>

<nav class="tabs">
  <div class="tabbar" role="tablist">
    <button role="tab" data-tab="progress" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>Progress</button>
    <button class="fab" id="addBtn" aria-label="Add weigh-in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button role="tab" data-tab="history" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4.5h11a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8.5h6"/></svg>History</button>
  </div>
</nav>

<script>
"use strict";
/* ---------- state ---------- */
const KEY = "trendline-scale-v1";
const NATIVE = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.store);
const DEFAULTS = { unit:"kg", goal:null, start:null, step:null, commit:null, goalSince:null, celebrated:null, smooth:0.1, theme:"auto", chartRange:90,
  healthRead:false, healthWrite:false, healthSince:null, healthFrom:null, healthIgnore:[], notifyWeigh:true, remind:false, remindTime:"07:30",
  lock:false, updateSeen:null, updateChecked:0 };
// Saved-data format. Bump SCHEMA and add MIGRATIONS[old] when the shape of saved data changes.
const SCHEMA = 3;
const DROPPED_SETTINGS = ["models", "actRead", "dayMode", "dayCutoff", "dayStarts", "sleepAsked", "cards", "cols", "reportMode", "height", "accent", "haptics"];
const MIGRATIONS = {
  // 1: data from before versioning. Nothing to change.
  // 2: the redesign keeps weight only, so food, activity and body composition go.
  2: d => {
    delete d.food; delete d.foodCache; delete d.activity;
    for (const e of d.entries || []){ delete e.fat; delete e.lean; }
    const s = d.settings || {};
    for (const k of DROPPED_SETTINGS) delete s[k];
    if (s.chartRange === 7) s.chartRange = 30;
  }
};
let S = { schema:SCHEMA, entries:[], settings:{...DEFAULTS} };

function upgrade(d){
  for (let v = d.schema || 1; v < SCHEMA; v++) if (MIGRATIONS[v]) MIGRATIONS[v](d);
  d.schema = SCHEMA;
  return d;
}
function normalize(){
  const s = S.settings;
  if (!Array.isArray(s.healthIgnore)) s.healthIgnore = [];
  if (!RANGES.some(r => r[0] === s.chartRange)) s.chartRange = 90;
}
function load(){
  let migrated = false;
  try{
    const raw = (NATIVE && typeof window.__NATIVE_STATE__ === "string") ? window.__NATIVE_STATE__ : localStorage.getItem(KEY);
    if (raw){
      const d = JSON.parse(raw); migrated = (d.schema || 1) < SCHEMA; upgrade(d);
      S.entries = Array.isArray(d.entries) ? d.entries : []; S.settings = {...DEFAULTS, ...(d.settings || {})};
    }
  }catch(e){}
  normalize(); sortEntries();
  if (migrated) save();
}
function save(){
  const json = JSON.stringify(S);
  if (NATIVE){ try{ window.webkit.messageHandlers.store.postMessage(json); }catch(e){} }
  try{ localStorage.setItem(KEY, json); }catch(e){}
}
function sortEntries(){ S.entries.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); }
function nativeCmd(cmd, data){ if (!NATIVE || !window.webkit.messageHandlers.native) return; try{ window.webkit.messageHandlers.native.postMessage(Object.assign({cmd}, data || {})); }catch(e){} }
function haptic(kind){ nativeCmd("haptic", { kind }); }

/* ---------- dates & units ---------- */
const DAY = 864e5;
const pad = n => String(n).padStart(2,"0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const localDate = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const dnum = s => { const [y,m,d] = s.split("-").map(Number); return Date.UTC(y,m-1,d)/DAY; };

const LB = 2.2046226218;

// Exponentially smoothed trend that respects gaps between weigh-ins.
const counts = e => !e.ignored && !(e.outlier && !e.keep);

// Flags a weigh-in that is far from the trend (someone else on the scale, clothes, a big meal) until you confirm it.

function startWeight(){ return S.settings.start ?? (S.entries[0] ? S.entries[0].kg : null); }

  else if (event === "backup-info"){ const changed = JSON.stringify(p) !== JSON.stringify(backupInfo); backupInfo = p; if (changed && tab === "settings") render(); }

    try{

};
function stamp(d){ return `${d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}, ${d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}`; }
function backupText(){
  if (!backupInfo || !backupInfo.last) return "No automatic backup yet. One is saved the next time something changes.";

/* ---------- Apple Health ---------- */
function syncHealth(full){
  if (!NATIVE || !S.settings.healthRead) return;
  let since = (!full && S.settings.healthSince) ? fromDnum(dnum(S.settings.healthSince) - 7) : "2000-01-01";
  if (S.settings.healthFrom && since < S.settings.healthFrom) since = S.settings.healthFrom;
  nativeCmd("healthRead", { since });
}
let connectPending = false;
// samples: first weight of each day from other apps and scales. own: weights this app saved to Health.
function mergeHealth(samples, error, own){
  if (error){ toast("Could not read from Apple Health."); connectPending = false; return; }
  const ignore = new Set(S.settings.healthIgnore || []);
  let added = 0, changed = 0;
  // Weigh-ins this app saved to Health earlier but no longer has (after a reinstall or "Erase all data"): bring them back.
  // Days you deleted in the app are in the ignore list and stay deleted.
  const ownByDay = {};
  for (const [t, kg] of own || []){ const d = localDate(t); if (!ownByDay[d] || t > ownByDay[d].t) ownByDay[d] = { t, kg }; }
  for (const [d, w] of Object.entries(ownByDay)){
    if (ignore.has(d) || (S.settings.healthFrom && d < S.settings.healthFrom) || !(w.kg > 20 && w.kg < 400)) continue;
    if (S.entries.some(e => e.date === d) || samples.some(x => x.date === d && x.kg)) continue;
    S.entries.push({ id: "r" + d, date: d, kg: w.kg, note: "", t: w.t, restored: true }); added++;
  }
  for (const smp of samples){
    if (!smp || !smp.date || ignore.has(smp.date) || (S.settings.healthFrom && smp.date < S.settings.healthFrom)) continue;
    if (!(smp.kg > 20 && smp.kg < 400)) continue;
    let ex = S.entries.find(e => e.date === smp.date);
    if (!ex){ ex = { id: "h" + smp.date, date: smp.date, kg: smp.kg, note: "", src: "health" }; if (smp.t) ex.t = smp.t; S.entries.push(ex); added++; continue; }
    if (smp.t && !ex.t) ex.t = smp.t;
    else if (ex.src === "health" && (Math.abs(ex.kg - smp.kg) > 0.005 || (smp.t && ex.t !== smp.t))){ ex.kg = smp.kg; if (smp.t) ex.t = smp.t; delete ex.outlier; delete ex.reviewed; changed++; }
  }
  S.settings.healthSince = todayStr();
  sortEntries(); detectOutliers(); save();
  if (added || changed){
    render(); scheduleReminder();
    if (added) toast(`Added ${added} weigh-in${added > 1 ? "s" : ""} from Apple Health`);
    checkCelebrate(added > 3);
  } else {
    if (connectPending) toast(`Apple Health connected ✓ No weigh-ins since ${fmtDate(S.settings.healthFrom || todayStr())} yet.`);
    render();
  }
  connectPending = false;
}
function connectHealth(){
  S.settings.healthRead = true; if (!S.settings.healthFrom) S.settings.healthFrom = todayStr(); save(); connectPending = true;
  nativeCmd("healthAuthorize", { write: S.settings.healthWrite });
  if (S.settings.notifyWeigh !== false) nativeCmd("notifyAuth");
  toast("Checking Apple Health…");
}
function scheduleReminder(){
  if (!NATIVE) return;
  const [h, m] = (S.settings.remindTime || "07:30").split(":").map(Number);
  let body = "Step on the scale before breakfast.";
  if (S.entries.length){ const r = computeTrend(); if (r.length) body = `Your trend is ${fw(r[r.length-1].trend)} ${U()}. Step on the scale before breakfast.`; }
  nativeCmd("reminder", { enabled: !!S.settings.remind, hour: isNaN(h) ? 7 : h, minute: isNaN(m) ? 30 : m, weighedToday: S.entries.some(e => e.date === todayStr()), body });

/* ---------- celebrations ---------- */
function reachedMilestones(){
  const rows = computeTrend(); if (!rows.length) return [];
  const t = rows[rows.length-1].trend, dir = goalDir();
  return milestones().filter(m => dir < 0 ? t <= m + 0.001 : t >= m - 0.001);
}
function checkCelebrate(silent){
  if (S.settings.goal == null || !S.entries.length) return;
  const reached = reachedMilestones();
  const done = new Set((S.settings.celebrated || []).map(x => Number(x).toFixed(2)));
  const fresh = reached.filter(m => !done.has(m.toFixed(2)));
  if (S.settings.celebrated == null) silent = true;
  if (!fresh.length){ if (S.settings.celebrated == null){ S.settings.celebrated = []; save(); } return; }
  S.settings.celebrated = [...(S.settings.celebrated || []), ...fresh]; save();
  if (silent) return;
  const best = fresh[fresh.length-1], isGoal = Math.abs(best - S.settings.goal) < 0.01;
  showCelebration(isGoal, best);

function resetCelebrations(){ S.settings.celebrated = null; checkCelebrate(true); }
function showCelebration(isGoal, value){
  haptic("success");
  const el = document.createElement("div"); el.className = "celebrate";
  const dir = goalDir() < 0 ? "below" : "above";
  el.innerHTML = `<canvas></canvas><div class="cel-card" role="dialog" aria-modal="true">
    <div class="cel-ring">${isGoal ? ICON.flag : ICON.check}</div>
    <h2>${isGoal ? "Goal reached" : "Milestone reached"}</h2>
    <div class="num">${fw(value)} <span style="font-size:20px;color:var(--muted)">${U()}</span></div>
    <p>${isGoal ? "Your trend weight reached your goal. Set the next one whenever you're ready." : `Your trend weight is now ${dir} ${fw(value)} ${U()}.`}</p>
    <button class="btn primary" id="celOk">${isGoal ? "Done" : "Keep going"}</button></div>`;
  document.body.appendChild(el);
  const close = () => { el.remove(); };
  el.querySelector("#celOk").onclick = close;
  el.addEventListener("click", ev => { if (ev.target === el) close(); });

  // a light shower of paper in the app's own colours

    for (const p of ps){ p.vy += 0.3; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;

}

function goalCard(rows){

  const left = last.trend - g, miles = milestones();
  const nextIdx = miles.findIndex(m => dir < 0 ? last.trend > m : last.trend < m);
  const marks = miles.length <= 25 ? miles.slice(0, -1).map(m => {
    const at = tot === 0 ? 1 : (st - m)/tot, on = dir < 0 ? last.trend <= m : last.trend >= m;

  else next = `Next milestone <b class="num" style="color:var(--fg)">${fw(miles[nextIdx])} ${U()}</b> · ${Math.abs(toU(last.trend - miles[nextIdx])).toFixed(1)} ${U()} away`;
  return `<section class="card"><div class="card-h"><h2>Goal ${fw(g)} ${U()}</h2><button class="mini-btn" id="glSet" aria-label="Edit goal">${ICON.pencil}</button></div>
    <div class="gline num">${Math.round(done*100)}% <small>· ${goalReached(last.trend) ? "done" : `${Math.abs(toU(left)).toFixed(1)} ${U()} to go`}</small></div>
    <div class="gbar" role="progressbar" aria-valuenow="${Math.round(done*100)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${done*100}%"></span>${marks}</div>
    <div class="gends num"><span>${fw(st)}</span><span>${fw(g)}</span></div>

}
function predictCard(rows){

/* ---------- chart ---------- */
function niceStep(range, target){ const raw = range/target, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw/p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10)*p; }
// Draws the weight chart into context c at size W×H: grey dots for weigh-ins, the sage trend line,
// faint milestone lines and the dashed goal line. Returns the x scale and visible rows for the tooltip.
function paintChart(c, W, H, allRows, R){
  const end = allRows[allRows.length-1].n;
  let rows = R ? allRows.filter(r => r.n > end - R) : allRows; if (!rows.length) rows = allRows.slice(-1);
  const x0 = R ? end - R : rows[0].n, x1 = Math.max(end, x0 + 1);
  const vals = rows.flatMap(r => [toU(r.kg), toU(r.trend)]); if (S.settings.goal != null && R === 0) vals.push(toU(S.settings.goal));
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi - lo < 1){ const m = (hi + lo)/2; lo = m - .5; hi = m + .5; }
  const st = niceStep(hi - lo, 4); lo = Math.floor(lo/st)*st; hi = Math.ceil(hi/st)*st;
  const L = 40, Rp = 8, T = 10, B = 24;
  const X = n => L + (n - x0)/(x1 - x0)*(W - L - Rp);
  const Y = v => T + (hi - v)/(hi - lo)*(H - T - B);
  const muted = css("--muted"), line = css("--line"), trend = css("--trend"), goal = css("--goal"), dot = css("--dot");
  c.font = `500 11px ${NUMFONT}`; c.textBaseline = "middle";
  for (let v = lo; v <= hi + 1e-9; v += st){
    c.strokeStyle = line; c.lineWidth = 1; c.beginPath(); c.moveTo(L, Math.round(Y(v)) + .5); c.lineTo(W - Rp, Math.round(Y(v)) + .5); c.stroke();
    c.fillStyle = muted; c.textAlign = "right"; c.fillText(v.toFixed(st < 1 ? 1 : 0), L - 8, Y(v));
  }
  c.textAlign = "center"; c.textBaseline = "alphabetic";
  const span = x1 - x0;
  if (span <= 45){ for (let n = Math.ceil(x0/7)*7 + 3; n <= x1; n += 7){ const p = parts(fromDnum(n)); c.fillStyle = muted; c.fillText(`${p.d} ${MON[p.m-1]}`, X(n), H - 6); } }
  else {
    const d0 = new Date(x0*DAY); let cur = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 1));
    const every = span > 1500 ? 12 : span > 500 ? 3 : span > 200 ? 2 : 1;
    while (cur.getTime()/DAY <= x1){
      const n = cur.getTime()/DAY, m = cur.getUTCMonth();
      if (m % every === 0){ c.fillStyle = muted; c.fillText(every >= 12 || m === 0 ? String(cur.getUTCFullYear()) : MON[m], X(n), H - 6); }
      cur = new Date(Date.UTC(cur.getUTCFullYear(), m + 1, 1));
    }
  }
  // milestones and goal, labelled at the right edge
  const g = S.settings.goal;
  if (g != null){
    c.font = `600 11px ${NUMFONT}`; c.textAlign = "right"; c.textBaseline = "bottom";
    const miles = milestones();
    for (const m of miles){
      const y = Y(toU(m)), isGoal = Math.abs(m - g) < 0.001;
      if (y < T || y > H - B) continue;
      c.strokeStyle = goal; c.globalAlpha = isGoal ? 1 : .35; c.lineWidth = isGoal ? 1.5 : 1;
      if (isGoal) c.setLineDash([5, 5]);
      c.beginPath(); c.moveTo(L, Math.round(y) + .5); c.lineTo(W - Rp, Math.round(y) + .5); c.stroke(); c.setLineDash([]);
      c.globalAlpha = isGoal ? 1 : .75; c.fillStyle = goal; c.fillText(isGoal ? `Goal ${fw(m)}` : fw(m), W - Rp - 2, y - 3);
      c.globalAlpha = 1;
    }
  }
  c.save(); c.beginPath(); c.rect(L, 0, W - L - Rp, H); c.clip();
  const firstIdx = allRows.indexOf(rows[0]); const lead = firstIdx > 0 ? [allRows[firstIdx-1], ...rows] : rows;
  if (rows.length <= 500) for (const r of rows){ c.fillStyle = dot; c.beginPath(); c.arc(X(r.n), Y(toU(r.kg)), rows.length > 150 ? 2 : 3, 0, 7); c.fill(); }
  c.strokeStyle = trend; c.lineWidth = 3; c.lineJoin = "round"; c.lineCap = "round"; c.beginPath();
  lead.forEach((r,i) => { const x = X(r.n), y = Y(toU(r.trend)); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke();
  const lr = rows[rows.length-1]; c.fillStyle = trend; c.beginPath(); c.arc(X(lr.n), Y(toU(lr.trend)), 5.5, 0, 7); c.fill();
  c.strokeStyle = css("--surface"); c.lineWidth = 2; c.stroke();

}
function mountChart(cv, tip, allRows, R){

  let lastId = null;
  const show = ev => {
    const rect = cv.getBoundingClientRect(), px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
    let best = g.rows[0], bd = 1e9; for (const r of g.rows){ const d = Math.abs(g.X(r.n) - px); if (d < bd){ bd = d; best = r; } }
    if (best.id !== lastId){ lastId = best.id; haptic("selection"); }
    tip.hidden = false; tip.style.left = Math.max(80, Math.min(W - 80, g.X(best.n))) + "px";
    tip.innerHTML = `${fmtDate(best.date)} · <b class="num">${fw(best.kg)}</b> <span style="color:var(--muted)">trend <span class="num">${fw(best.trend)}</span></span>`;
  };
  cv.onpointerdown = show; cv.onpointermove = ev => { if (ev.pointerType === "mouse" || ev.buttons) show(ev); };

}
let resizeT; window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => {
  if (tab === "progress" && $("#chart")){ const rows = computeTrend(); if (rows.length) mountChart($("#chart"), $("#tip"), rows, S.settings.chartRange); }
}, 120); });

/* ---------- history ---------- */
function renderHistory(){
  const valid = computeTrend(), vIdx = new Map(valid.map((r, i) => [r.id, i]));
  const rows = S.entries.map(e => { const i = vIdx.get(e.id); return i == null ? { ...e, trend: null, excluded: true } : valid[i]; });
  const byMonth = new Map(); rows.forEach(r => { const k = r.date.slice(0, 7); if (!byMonth.has(k)) byMonth.set(k, []); byMonth.get(k).push(r); });
  let html = `<h1 class="large">History<small>${S.entries.length} weigh-in${S.entries.length > 1 ? "s" : ""}</small></h1>`;
  [...byMonth.keys()].sort().reverse().forEach(k => {
    const [y, m] = k.split("-").map(Number);
    // trend change across the month: end of this month against the end of the previous one
    const inMonth = valid.filter(r => r.date.slice(0, 7) === k), before = valid.filter(r => r.date < k + "-01");
    const ch = inMonth.length ? inMonth[inMonth.length-1].trend - (before.length ? before[before.length-1].trend : inMonth[0].trend) : null;
    const chHtml = ch == null || (!before.length && inMonth.length < 2) ? "" : `<span class="num ${tone(ch)}">${arrow(ch)} ${Math.abs(toU(ch)).toFixed(1)} ${U()}</span>`;
    html += `<section class="card month"><div class="month-h"><h3>${MONF[m-1]} ${y}</h3>${chHtml}</div>
      <div class="hgrid hhead"><span>Day</span><span>Weight</span><span>vs trend</span><span>Trend</span></div>`;
    byMonth.get(k).slice().reverse().forEach(r => {
      const p = parts(r.date), diff = r.excluded ? null : r.kg - r.trend;
      const bits = []; if (r.ignored) bits.push("Ignored, not counted"); else if (r.excluded) bits.push("Unusual, check it on Progress");
      if (r.note) bits.push(esc(r.note));
      const df = diff == null ? "—" : Math.abs(diff) < 0.05 ? "0.0" : `${diff < 0 ? "▼" : "▲"} ${Math.abs(toU(diff)).toFixed(1)}`;
      html += `<div class="swipe"><button class="del" data-del="${esc(r.id)}">Delete</button>
        <button class="lrow hgrid ${r.excluded ? "out" : ""}" data-id="${esc(r.id)}">
          <span class="d"><b class="num">${pad(p.d)}</b><small>${WD[p.wd]}</small></span>
          <span class="w num">${fw(r.kg)}${r.src === "health" ? ICON.heart : ""}</span>
          <span class="df num c ${diff == null ? "flat" : tone(diff) === "good" ? "good" : "flat"}">${df}</span>
          <span class="t num c">${r.excluded ? "—" : fw(r.trend)}</span>
          ${bits.length ? `<span class="memo">${bits.join(" · ")}</span>` : ""}
        </button></div>`;
    });
    html += `</section>`;
  });
  view.innerHTML = html;
  view.querySelectorAll(".lrow").forEach(b => b.onclick = () => {
    if (suppressClick) return;
    if (swipeOpen){ closeSwipe(); return; }
    openEntry(S.entries.find(e => e.id === b.dataset.id));
  });
  view.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { const e = S.entries.find(x => x.id === b.dataset.del); if (e) deleteEntry(e); });
}
// swipe left on a history row to reveal Delete
let sw = null, swipeOpen = null, suppressClick = false;
function closeSwipe(){ if (swipeOpen){ swipeOpen.style.transform = ""; swipeOpen = null; } }
view.addEventListener("touchstart", ev => {
  const row = ev.target.closest(".lrow"); if (!row){ if (!ev.target.closest(".del")) closeSwipe(); return; }
  sw = { row, x: ev.touches[0].clientX, y: ev.touches[0].clientY, dx: 0, active: false, base: row === swipeOpen ? -88 : 0 };
}, { passive:true });
view.addEventListener("touchmove", ev => {
  if (!sw) return;
  const dx = ev.touches[0].clientX - sw.x, dy = ev.touches[0].clientY - sw.y;
  if (!sw.active){
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)){ sw.active = true; if (swipeOpen && swipeOpen !== sw.row) closeSwipe(); sw.row.classList.add("dragging"); }
    else if (Math.abs(dy) > 10){ sw = null; return; } else return;
  }

}, { passive:true });

function deleteEntry(entry){

  S.entries = S.entries.filter(e => e !== entry); save(); haptic("warning"); swipeOpen = null; render(); scheduleReminder();

  sh.querySelector("#em").onclick = () => bump(-0.1); sh.querySelector("#ep").onclick = () => bump(0.1);

  };
  sh.querySelector("#es").onclick = submit; sh.querySelector("#es2").onclick = submit;
  w.addEventListener("keydown", ev => { if (ev.key === "Enter"){ ev.preventDefault(); w.blur(); } });
}
function numberSheet({ title, intro, label, value, placeholder, onSave, onClear }){
  const sh = openSheet(`<div class="sheet-h"><button class="link" data-x>Cancel</button><h2>${title}</h2><span style="width:52px"></span></div>
    ${intro ? `<p class="note">${intro}</p>` : ""}
    <div class="wbig"><input id="nv" class="num" inputmode="decimal" autocomplete="off" value="${value ?? ""}" placeholder="${placeholder}" aria-label="${label}"></div>
    <div style="text-align:center;color:var(--muted);margin-top:-10px;font-weight:600">${label}</div>
    <p class="err" id="ne" hidden></p>
    <button class="btn primary" id="ns">Save</button>
    ${onClear && value != null && value !== "" ? `<button class="btn" id="nc">Remove</button>` : ""}`);
  const i = sh.querySelector("#nv"); setTimeout(() => { i.focus(); i.select(); }, 350);
  sh.querySelector("#ns").onclick = () => { const v = parseFloat(i.value.replace(",", ".")); if (isNaN(v) || v <= 0){ const e = sh.querySelector("#ne"); e.hidden = false; e.textContent = "Enter a number above zero."; haptic("warning"); return; } onSave(v); closeSheet(); haptic("success"); render(); };
  const c = sh.querySelector("#nc"); if (c) c.onclick = () => { onClear(); closeSheet(); render(); };
}
function openCommit(){
  numberSheet({ title: "Weekly commitment", intro: `The pace you plan to ${goalDir() < 0 ? "lose" : "gain"} each week. The prediction shows when it would get you to your goal.`,
    label: `${U()} per week`, value: S.settings.commit ? toU(S.settings.commit).toFixed(2) : "", placeholder: U() === "lb" ? "1.0" : "0.5",
    onSave: v => { S.settings.commit = fromU(v); save(); }, onClear: () => { S.settings.commit = null; save(); } });
}
function openGoalSheet(){
  const rows = computeTrend();
  numberSheet({ title: "Goal weight", intro: "Your trend weight is measured against this goal. Starting weight and milestones are in Settings.", label: U(),
    value: S.settings.goal != null ? toU(S.settings.goal).toFixed(1) : "", placeholder: rows.length ? fw(rows[rows.length-1].trend) : "70.0",
    onSave: v => { setGoal(fromU(v)); checkCelebrate(true); }, onClear: () => setGoal(null) });
}
function setGoal(kg){
  const changed = kg !== S.settings.goal; S.settings.goal = kg;
  if (changed){ S.settings.goalSince = kg == null ? null : todayStr(); resetCelebrations(); }
  save();
}

/* ---------- updates ---------- */
const REPO = "husain-313/Weight-tracker";
let latestRelease = null;
const buildOf = s => { const m = String(s || "").match(/\((\d+)\)|build[- ](\d+)/i); return m ? +(m[1] || m[2]) : 0; };
async function checkUpdate(manual){
  if (!NATIVE) return;
  if (!manual && Date.now() - (S.settings.updateChecked || 0) < 6*3600e3) return;
  try{
    const r = await http({ url: `https://api.github.com/repos/${REPO}/releases/latest`, headers: { "Accept": "application/vnd.github+json", "User-Agent": "Trendline" } });
    S.settings.updateChecked = Date.now(); save();
    if (r.status !== 200){ if (manual) toast("Couldn't check for updates right now."); return; }
    const d = JSON.parse(r.body), asset = (d.assets || []).find(a => /\.ipa$/i.test(a.name));
    const mine = buildOf(window.__APP_VERSION__), theirs = buildOf(d.tag_name);
    latestRelease = { name: d.name || d.tag_name, build: theirs, notes: d.body || "", url: asset ? asset.browser_download_url : d.html_url, page: d.html_url };
    if (theirs > mine){ if (manual || S.settings.updateSeen !== theirs) openUpdate(); if (tab === "settings") render(); }
    else if (manual) toast("You have the latest version");
  }catch(e){ if (manual) toast("Couldn't check for updates right now."); }
}
function openUpdate(){
  const u = latestRelease; if (!u) return;
  S.settings.updateSeen = u.build; save(); haptic("light");
  const notes = u.notes.split(/\n+/).filter(l => l.trim() && !/^Unsigned IPA|^Built with/.test(l)).join("\n");
  const sh = openSheet(`<div class="sheet-h"><button class="link" data-x>Later</button><h2>Update available</h2><span style="width:52px"></span></div>
    <div class="empty" style="padding:6px 0;gap:8px;display:flex;flex-direction:column"><div class="ring">${ICON.scale}</div><h2 style="font-size:20px">${esc(u.name.replace(/\s*\(build \d+\)/i, ""))}</h2>
      <p class="lbl">You have ${esc(window.__APP_VERSION__ || "an older version")}</p></div>
    <p class="note sel" style="white-space:pre-line;color:var(--fg)">${esc(notes)}</p>
    <button class="btn primary" id="uDl">Download update</button>
    <button class="btn" id="uCp">Copy download link</button>
    <p class="note" style="font-size:13px">Then install it with Signulous like before, keeping the same bundle ID so your data stays.</p>`);
  sh.querySelector("#uDl").onclick = () => { nativeCmd("openURL", { url: u.url }); haptic("light"); };
  sh.querySelector("#uCp").onclick = () => { nativeCmd("copy", { text: u.url }); haptic("success"); toast("Link copied"); };
}
let httpSeq = 0;
const httpWait = {};
function http(req){
  return new Promise((resolve, reject) => {
    if (!NATIVE) return reject(new Error("This works in the iPhone app"));
    const id = ++httpSeq; httpWait[id] = { resolve, reject };
    nativeCmd("http", { id, method: req.method || "GET", url: req.url, headers: req.headers || {}, body: req.body });
    setTimeout(() => { if (httpWait[id]){ delete httpWait[id]; reject(new Error("timed out")); } }, 35000);
  });
}

/* ---------- settings ---------- */
function renderSettings(){
  const s = S.settings, bk = backupInfo || {};
  const tgl = (id, on, k, h) => `<label class="item"><span class="k">${k}${h ? `<span class="h">${h}</span>` : ""}</span><input type="checkbox" class="tg" id="${id}" ${on ? "checked" : ""}></label>`;
  const inp = (id, k, val, ph, h) => `<label class="item"><span class="k">${k}${h ? `<span class="h">${h}</span>` : ""}</span><input id="${id}" class="num" inputmode="decimal" value="${val}" placeholder="${ph}"></label>`;
  let html = `<h1 class="large">Settings</h1>
    <div class="group-t">Goal</div><div class="list">
      ${inp("sg", "Goal weight", s.goal == null ? "" : toU(s.goal).toFixed(1), U())}
      ${inp("ss", "Starting weight", s.start == null ? "" : toU(s.start).toFixed(1), S.entries[0] ? fw(S.entries[0].kg) : U(), "Defaults to your first weigh-in")}
      ${inp("sm", "Milestone every", s.step == null ? "" : toU(s.step).toFixed(1), U() === "lb" ? "5.0" : "2.0")}
      ${inp("sc", "Weekly commitment", s.commit == null ? "" : toU(s.commit).toFixed(2), `${U()}/wk`)}
    </div>
    <div class="group-t">Weight & trend</div><div class="list">
      <label class="item"><span class="k">Units</span><select id="su"><option value="kg" ${s.unit === "kg" ? "selected" : ""}>Kilograms</option><option value="lb" ${s.unit === "lb" ? "selected" : ""}>Pounds</option></select></label>
      <label class="item"><span class="k">Trend smoothing<span class="h">Heavier smoothing ignores daily swings more but reacts slower</span></span>
        <select id="sa"><option value="0.2" ${s.smooth == 0.2 ? "selected" : ""}>Light</option><option value="0.1" ${s.smooth == 0.1 ? "selected" : ""}>Standard</option><option value="0.05" ${s.smooth == 0.05 ? "selected" : ""}>Heavy</option></select></label>
    </div>`;
  if (NATIVE){
    html += `<div class="group-t">Apple Health</div><div class="list">
      ${tgl("hr", s.healthRead, "Import weigh-ins", "Weight from your smart scale or other apps")}
      ${tgl("hw", s.healthWrite, "Save weigh-ins to Health", "Weights you log here are added to Apple Health")}
      ${s.healthRead ? `<label class="item"><span class="k">Import from<span class="h">Older readings in Apple Health are ignored</span></span><input type="date" id="hf" value="${s.healthFrom || ""}" max="${todayStr()}"></label>` : ""}
      ${s.healthRead ? tgl("hn", s.notifyWeigh !== false, "Notify after each weigh-in", "Weight and trend as soon as your scale syncs") : ""}
      ${s.healthRead ? `<button class="item" id="hs"><span class="k">Check now</span><span class="val">${s.healthSince ? "Last " + fmtDate(s.healthSince) : "Not yet"}</span></button>` : ""}
    </div>
    <div class="group-t">Reminder</div><div class="list">
      ${tgl("rm", s.remind, "Remind me to weigh in", "Skipped on days you've already weighed in")}
      <label class="item"><span class="k">Time</span><input type="time" id="rt" value="${s.remindTime || "07:30"}" ${s.remind ? "" : "disabled"}></label>
    </div>`;
  }
  html += `<div class="group-t">Backup</div><div class="list">
      ${NATIVE ? `<button class="item" id="bf"><span class="k">Backup folder<span class="h">${esc(folderText())}</span></span><span class="val" style="color:var(--${bk.folder && !bk.folderError ? "trend" : "muted"})">${bk.folder ? esc(bk.folder) : "Choose"}</span></button>
      <button class="item action" id="bn">Back up now</button>` : ""}
      <button class="item action" id="bx">Export backup</button>
      <button class="item action" id="bc">Export spreadsheet (CSV)</button>
      <button class="item action" id="bi">Restore from backup</button>
    </div>
    <p class="group-f">${NATIVE ? esc(backupText()) + " Automatic backups are in the Files app: On My iPhone › Trendline › Backups." : "Your data stays on this device. Export a backup now and then."}</p>
    ${NATIVE && bk.folder ? `<div class="list"><button class="item action" id="bfr">Stop copying to ${esc(bk.folder)}</button></div>` : ""}
    <div class="group-t">Appearance</div><div class="list">
      <label class="item"><span class="k">Theme</span><select id="st"><option value="auto" ${s.theme === "auto" ? "selected" : ""}>Match iPhone</option><option value="light" ${s.theme === "light" ? "selected" : ""}>Light</option><option value="dark" ${s.theme === "dark" ? "selected" : ""}>Dark</option></select></label>
    </div>
    ${NATIVE ? `<div class="group-t">Privacy</div><div class="list">${tgl("lk", s.lock, "Lock with Face ID", "Asks for Face ID or your passcode when you open the app")}</div>` : ""}
    ${NATIVE ? `<div class="group-t">About</div><div class="list">
      <div class="item"><span class="k">Version</span><span class="val">${esc(window.__APP_VERSION__ || "—")}</span></div>
      ${bk.bundle ? `<div class="item"><span class="k">Bundle ID</span><span class="val" style="font-size:13px">${esc(bk.bundle)}</span></div>` : ""}
      ${latestRelease && latestRelease.build > buildOf(window.__APP_VERSION__) ? `<button class="item action" id="upOpen">Update to ${esc(latestRelease.name.replace(/\s*\(build \d+\)/i, ""))}</button>` : ""}
      <button class="item action" id="upChk">Check for updates</button></div>` : ""}
    <div class="list" style="margin-top:8px"><button class="item danger" id="bd">Erase all data</button></div>
    <p class="footer">Trendline${window.__APP_VERSION__ ? " " + esc(window.__APP_VERSION__) : ""}</p>`;
  view.innerHTML = html;

  const num = (id, cb) => $(id).addEventListener("change", e => { const raw = e.target.value.trim().replace(",", "."), v = raw === "" ? null : parseFloat(raw); if (raw !== "" && (isNaN(v) || v <= 0)){ toast("Enter a number above zero"); return; } cb(v); save(); haptic("light"); toast("Saved"); });
  num("#sg", v => setGoal(v == null ? null : fromU(v)));
  num("#ss", v => { S.settings.start = v == null ? null : fromU(v); resetCelebrations(); });
  num("#sm", v => { S.settings.step = v == null ? null : fromU(v); resetCelebrations(); });
  num("#sc", v => S.settings.commit = v == null ? null : fromU(v));
  $("#su").onchange = e => { S.settings.unit = e.target.value; save(); haptic("light"); render(); };
  $("#sa").onchange = e => { S.settings.smooth = parseFloat(e.target.value); save(); resetCelebrations(); haptic("light"); };
  $("#st").onchange = e => { S.settings.theme = e.target.value; save(); applyTheme(); render(); };
  $("#bx").onclick = () => exportFile(`trendline-backup-${todayStr()}.json`, JSON.stringify(S, null, 1), "application/json");
  $("#bc").onclick = () => { const rows = computeTrend(); exportFile(`trendline-${todayStr()}.csv`, "Date,Weight (kg),Trend (kg),Note\n" + rows.map(r => `${r.date},${r.kg.toFixed(2)},${r.trend.toFixed(2)},"${(r.note || "").replace(/"/g, '""')}"`).join("\n"), "text/csv"); };
  $("#bi").onclick = pickRestore;
  const bd = $("#bd"); let armed = false;
  bd.onclick = () => { if (!armed){ armed = true; bd.textContent = "Tap again to erase everything"; haptic("warning"); return; }
    const keepLock = S.settings.lock; S = { schema:SCHEMA, entries:[], settings:{...DEFAULTS, lock: keepLock} }; normalize(); save(); applyTheme(); scheduleReminder(); setTab("progress"); toast("All data erased"); };
  if (NATIVE){
    $("#hr").onchange = e => { if (e.target.checked) connectHealth(); else { S.settings.healthRead = false; save(); } haptic("light"); render(); };
    $("#hw").onchange = e => { S.settings.healthWrite = e.target.checked; save(); haptic("light"); if (e.target.checked) nativeCmd("healthAuthorize", { write: true }); };
    const hn = $("#hn"); if (hn) hn.onchange = e => { S.settings.notifyWeigh = e.target.checked; save(); haptic("light"); if (e.target.checked) nativeCmd("notifyAuth"); };
    const hf = $("#hf"); if (hf) hf.onchange = e => {
      const v = e.target.value; if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
      const older = S.settings.healthFrom && v < S.settings.healthFrom;
      S.settings.healthFrom = v;
      const before = S.entries.length; S.entries = S.entries.filter(x => !(x.src === "health" && x.date < v)); const removed = before - S.entries.length;
      S.settings.healthIgnore = S.settings.healthIgnore.filter(d => d >= v);
      save(); haptic("light"); resetCelebrations(); render();
      if (older) syncHealth(true);
      toast(removed ? `Removed ${removed} older Apple Health weigh-in${removed > 1 ? "s" : ""}` : `Importing from ${fmtDate(v)}`);
    };
    const hs = $("#hs"); if (hs) hs.onclick = () => { syncHealth(true); toast("Checking Apple Health…"); };
    $("#rm").onchange = e => { S.settings.remind = e.target.checked; save(); haptic("light"); scheduleReminder(); render(); if (e.target.checked) toast(`Reminder set for ${S.settings.remindTime}`); };
    $("#rt").onchange = e => { if (!e.target.value) return; S.settings.remindTime = e.target.value; save(); scheduleReminder(); toast(`Reminder set for ${e.target.value}`); };
    $("#lk").onchange = e => { const want = e.target.checked; e.target.checked = S.settings.lock; nativeCmd("lockSet", { enabled: want }); };
    $("#bf").onclick = () => { haptic("light"); nativeCmd("chooseBackupFolder"); };
    $("#bn").onclick = () => { haptic("light"); nativeCmd("backupNow"); };
    const bfr = $("#bfr"); if (bfr) bfr.onclick = () => { haptic("light"); nativeCmd("removeBackupFolder"); toast("Stopped copying to the folder"); };
    $("#upChk").onclick = () => { haptic("light"); toast("Checking…"); checkUpdate(true); };
    const uo = $("#upOpen"); if (uo) uo.onclick = openUpdate;
    nativeCmd("backupInfo");
  }
}

/* ---------- backup ---------- */
function exportFile(name, text, type){
  haptic("light");
  if (NATIVE && window.webkit.messageHandlers.share){ window.webkit.messageHandlers.share.postMessage({ name, text }); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function pickRestore(){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async () => { const f = inp.files[0]; if (!f) return; restoreBackup(await f.text()); };
  inp.click();
}
function restoreBackup(text){
  let d; try{ d = JSON.parse(text); }catch(e){ d = null; }
  if (!d || !Array.isArray(d.entries)){ toast("That file isn't a Trendline backup."); haptic("warning"); return; }
  if ((d.schema || 1) > SCHEMA){ toast("This backup is from a newer Trendline. Update the app first."); haptic("warning"); return; }
  upgrade(d);
  let added = 0, updated = 0;
  for (const e of d.entries){
    if (!e || !/^\d{4}-\d{2}-\d{2}$/.test(e.date) || !(e.kg > 20 && e.kg < 400)) continue;
    const ex = S.entries.find(x => x.date === e.date);
    if (ex){ Object.assign(ex, e, { id: ex.id }); updated++; } else { S.entries.push({ ...e, id: e.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 7) }); added++; }
  }
  if (d.settings){ const keep = { lock: S.settings.lock }; S.settings = { ...DEFAULTS, ...d.settings, ...keep }; }
  normalize(); sortEntries(); save(); applyTheme(); scheduleReminder(); checkCelebrate(true); render(); haptic("success");
  toast(`Restored: ${added} new, ${updated} updated`);
}
function loadDemo(){
  const end = dnum(todayStr()); let w = 86;
  for (let i = 120; i >= 0; i--){ if (Math.random() < 0.15) continue; w += -0.06 + (Math.random() - .5)*0.15; const noise = (Math.random() - .5)*1.2;
    S.entries.push({ id: "demo" + i, date: fromDnum(end - i), kg: Math.round((w + noise)*10)/10, note: i === 60 ? "Demo data" : "" }); }
  S.settings.goal = 78; S.settings.goalSince = fromDnum(end - 120); S.settings.commit = 0.5;
  sortEntries(); resetCelebrations(); save(); render(true); toast("Demo data loaded. Erase it in Settings.");
}

/* ---------- toast ---------- */
let toastT;
function toast(msg, action){
  let t = $(".toast"); if (!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ""}`; t.hidden = false;
  if (action) t.querySelector("button").onclick = () => { t.hidden = true; action.fn(); };
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, action ? 4500 : 2600);
}

/* ---------- boot ---------- */
load(); applyTheme(); if (detectOutliers()) save();
syncTabbar(); render();
if (NATIVE){ syncHealth(false); scheduleReminder(); setTimeout(() => checkUpdate(false), 1500); }
checkCelebrate(S.settings.celebrated == null);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { applyTheme(); render(); });
</script>
