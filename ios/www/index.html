<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Trendline</title>
<style>
/* Layout: one calm column. Fixed top bar that fades in on scroll, a floating tab bar with a separate add button,
   settings as its own page, bottom sheets for editing.
   Palette and type follow Happy Scale's calm charcoal look: rounded type, blue for the trend, amber for the goal,
   and colours that mean something: green for moving toward your goal, red for moving away. */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#e9e9ef; --sheet:#ffffff; --bar:rgba(242,242,247,.86);
  --line:#e3e3e9; --line-strong:#c8c8cf; --fg:#1c1c1e; --muted:#6e6e76;
  --trend:#1a7ff0; --trend-ink:#ffffff; --trend-soft:rgba(26,127,240,.12);
  --goal:#e0921f; --goal-soft:rgba(224,146,31,.15);
  --good:#1f9d55; --good-soft:rgba(31,157,85,.13); --bad:#e0393e; --bad-soft:rgba(224,57,62,.12);
  --good-solid:#22a05a; --bad-solid:#e0434a; --solid-ink:#ffffff;
  --t-hi:#fde4e5; --t-hi-l:#c4353b; --t-la:#ececf1; --t-la-l:#6e6e76; --t-tr:#dcebff; --t-tr-l:#1a6fd6; --t-lo:#dcf3e5; --t-lo-l:#1b8a4b;
  --dot:#a7a7b0; --danger:#e0393e; --danger-soft:rgba(224,57,62,.12); --band:rgba(0,0,0,.025);
  --card-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04); --notch-on:rgba(255,255,255,.7);
  --font-ui:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121116; --surface:#1f1e24; --surface-2:#2b2a31; --sheet:#1f1e24; --bar:rgba(18,17,22,.86);
    --line:#302f36; --line-strong:#47464e; --fg:#ffffff; --muted:#8e8d96;
    --trend:#2f8fff; --trend-ink:#ffffff; --trend-soft:rgba(47,143,255,.16);
    --goal:#f2a93b; --goal-soft:rgba(242,169,59,.16);
    --good:#34c46e; --good-soft:rgba(52,196,110,.16); --bad:#ef5257; --bad-soft:rgba(239,82,87,.16);
    --good-solid:#1e6a42; --bad-solid:#8a2e35; --solid-ink:#ffffff;
    --t-hi:#6c2a31; --t-hi-l:#ff9ea4; --t-la:#35343b; --t-la-l:#a9a8b1; --t-tr:#1b4f84; --t-tr-l:#8ec5ff; --t-lo:#1d5838; --t-lo-l:#80e2a8;
    --dot:#5a5962; --danger:#ef5257; --danger-soft:rgba(239,82,87,.15); --band:rgba(255,255,255,.025);
    --card-shadow:none; --notch-on:rgba(18,17,22,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121116; --surface:#1f1e24; --surface-2:#2b2a31; --sheet:#1f1e24; --bar:rgba(18,17,22,.86);
  --line:#302f36; --line-strong:#47464e; --fg:#ffffff; --muted:#8e8d96;
  --trend:#2f8fff; --trend-ink:#ffffff; --trend-soft:rgba(47,143,255,.16);
  --goal:#f2a93b; --goal-soft:rgba(242,169,59,.16);
  --good:#34c46e; --good-soft:rgba(52,196,110,.16); --bad:#ef5257; --bad-soft:rgba(239,82,87,.16);
  --good-solid:#1e6a42; --bad-solid:#8a2e35; --solid-ink:#ffffff;
  --t-hi:#6c2a31; --t-hi-l:#ff9ea4; --t-la:#35343b; --t-la-l:#a9a8b1; --t-tr:#1b4f84; --t-tr-l:#8ec5ff; --t-lo:#1d5838; --t-lo-l:#80e2a8;
  --dot:#5a5962; --danger:#ef5257; --danger-soft:rgba(239,82,87,.15); --band:rgba(255,255,255,.025);
  --card-shadow:none; --notch-on:rgba(18,17,22,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--font-ui);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--trend);outline-offset:2px}
svg{display:block}
[hidden]{display:none!important}

/* top bar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top,0px);border-bottom:.5px solid transparent;transition:background .2s,border-color .2s}
.topbar.scrolled{background:var(--bar);-webkit-backdrop-filter:saturate(160%) blur(20px);backdrop-filter:saturate(160%) blur(20px);border-bottom-color:var(--line)}
.tb-inner{height:44px;display:flex;align-items:center;justify-content:center;position:relative;max-width:640px;margin:0 auto}
.tb-title{font-weight:700;font-size:17px}
.tb-left{position:absolute;left:16px;top:0;height:44px;display:flex;align-items:center}
.tb-right{position:absolute;right:16px;top:4px;display:flex;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--muted)}
.icon-btn svg{width:19px;height:19px}

main{padding:calc(env(safe-area-inset-top,0px) + 48px) 16px calc(env(safe-area-inset-bottom,0px) + 116px);max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
body[data-tab="settings"] main{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px)}
main.enter{animation:enter .28s cubic-bezier(.2,.8,.3,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1.large{margin:2px 0 0;font-size:34px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1.large small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}
.dateline{margin:2px 0 -6px;font-size:15px;font-weight:500;color:var(--muted)}

/* cards */
.card{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--card-shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.card-h h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.mini-btn{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.mini-btn svg{width:16px;height:16px}
.link{color:var(--trend);font-weight:600;font-size:16px}
.link.strong{font-weight:700}
.note{color:var(--muted);font-size:14px;margin:0;line-height:1.45}
.lbl{font-size:13px;color:var(--muted);font-weight:500}
.good{color:var(--good)} .bad{color:var(--bad)} .flat{color:var(--muted)}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:18px 0 6px}
.hero .big{font-size:68px;font-weight:700;line-height:1;letter-spacing:-.035em}
.hero .unit{font-size:22px;color:var(--muted);font-weight:600;margin-left:6px;letter-spacing:0;font-family:var(--font-ui)}
.chg{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 12px;font-size:15px;font-weight:650;background:var(--surface-2)}
.chg svg{width:15px;height:15px;flex:none}
.chg.good{background:var(--good-soft)} .chg.bad{background:var(--bad-soft)}
.hero .sub{font-size:14px;color:var(--muted)}

/* recent stats: a small chart of the last days beside four stacked tiles whose colour says what the number is */
.recent{display:grid;grid-template-columns:1fr 118px;gap:10px;align-items:stretch}
.recent canvas{display:block;width:100%;height:100%;min-height:200px}
.tiles{display:flex;flex-direction:column;gap:6px}
.tile{flex:1;border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;min-width:0;background:var(--tb)}
.tile .tl{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--tl)}
.tile .tv{font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.tile .ts{font-size:11px;color:var(--tl);font-weight:700;opacity:.85}
.tile.hi{--tb:var(--t-hi);--tl:var(--t-hi-l)} .tile.lo{--tb:var(--t-lo);--tl:var(--t-lo-l)}
.tile.tr{--tb:var(--t-tr);--tl:var(--t-tr-l)} .tile.la{--tb:var(--t-la);--tl:var(--t-la-l)}

/* chart */
.chart-card{padding:14px 12px 10px;gap:6px}
.chart-card .card-h{padding:0 4px}
.seg{display:flex;gap:2px}
.seg button{flex:1;padding:6px 2px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted);text-align:center}
.seg button[aria-pressed="true"]{color:var(--fg);font-weight:800;background:var(--surface-2)}
.chart-wrap{position:relative}
.chart-wrap canvas{display:block;width:100%;height:290px;touch-action:pan-y}
.tip{position:absolute;top:0;pointer-events:none;background:var(--sheet);border:.5px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translateX(-50%);box-shadow:0 4px 14px rgba(0,0,0,.12);transition:left .12s ease-out}

/* goal: thick bar, milestones as notches inside it */
.gbar{position:relative;height:14px;background:var(--surface-2);border-radius:999px;margin:6px 0 2px;overflow:hidden}
.gbar > span{position:absolute;left:0;top:0;bottom:0;background:var(--goal);border-radius:999px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.gbar .mk{position:absolute;top:3px;bottom:3px;width:2px;margin-left:-1px;border-radius:1px;background:var(--line-strong)}
.gbar .mk.on{background:var(--notch-on)}
.gends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.gline{font-size:22px;font-weight:700;letter-spacing:-.01em}
.gline small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}

/* prediction */
.pred-big{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.pred-big.muted{color:var(--muted);font-size:22px}
.pred-day{margin:2px 0 0;font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1}
.pred-sub{margin:-4px 0 0;font-size:16px;font-weight:600;color:var(--muted)}
.pred-alt{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-top:.5px solid var(--line);padding-top:12px;font-size:15px}
.pred-alt span{color:var(--muted)}
.pred-alt b{font-weight:650;white-space:nowrap}

/* history */
/* overflow:clip (not hidden) keeps the rounded corners without stopping the month header from sticking */
.month{padding:0 0 4px;gap:0;overflow:clip}
.month-h{position:sticky;top:calc(env(safe-area-inset-top,0px) + 44px);z-index:5;display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 10px;
  background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);border-bottom:.5px solid var(--line)}
.month-h h3{margin:0;font-size:18px;font-weight:800}
.month-h span{font-size:14px;font-weight:600}
.hgrid{display:grid;grid-template-columns:44px 1fr 1fr 74px;align-items:center;gap:8px}
.hhead{padding:8px 16px 6px;font-size:12px;font-weight:700;line-height:1.2;color:var(--muted);text-align:center;align-items:end;border-bottom:.5px solid var(--line)}
.hhead span:first-child{text-align:left}
.started{margin:8px 12px 10px;padding:7px;border-radius:10px;background:var(--trend);color:var(--trend-ink);text-align:center;font-weight:700;font-size:15px}
.lrow .c{text-align:center}
.dfp{display:inline-flex;align-items:center;justify-content:center;gap:3px;min-width:62px;padding:5px 8px;border-radius:8px;font-size:15px;font-weight:800;background:var(--surface-2);color:var(--muted)}
.dfp.good{background:var(--good-solid);color:var(--solid-ink)} .dfp.bad{background:var(--bad-solid);color:var(--solid-ink)}
.hbadge{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:var(--goal-soft);color:var(--goal);flex:none}
.hbadge svg{width:11px;height:11px}
.swipe{position:relative;overflow:hidden;border-bottom:.5px solid var(--line)}
.swipe:last-child{border-bottom:0}
.swipe .del{position:absolute;top:0;right:0;bottom:0;width:88px;background:var(--danger);color:#fff;font-weight:650;font-size:15px;text-align:center}
.lrow{position:relative;width:100%;padding:11px 16px;background:var(--surface);transition:transform .22s ease;touch-action:pan-y}
.lrow.dragging{transition:none}
.lrow .d{display:flex;flex-direction:column;line-height:1.1}
.lrow .d{align-items:center;color:var(--muted)}
.lrow .d b{font-size:17px;font-weight:700} .lrow .d small{font-size:12px;font-weight:600}
.lrow .w{font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.lrow .t{font-size:18px;font-weight:700}
.lrow .memo{grid-column:1/-1;font-size:13px;color:var(--muted);text-align:left;margin-top:-2px}
.lrow.out .w{color:var(--muted);text-decoration:line-through}

/* grouped lists (settings, sheets) */
.group-t{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin:10px 16px -10px}
.group-f{font-size:13px;color:var(--muted);margin:-8px 16px 0;line-height:1.4}
.list{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--card-shadow)}
.sheet .list{background:var(--surface-2);box-shadow:none}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;min-height:48px;border-bottom:.5px solid var(--line);width:100%}
.item:last-child{border-bottom:0}
.item .k{font-size:17px;min-width:0}
.item .h{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.3}
.item .k.wi{display:flex;align-items:center;gap:12px}
.ic{flex:none;width:29px;height:29px;border-radius:8px;display:grid;place-items:center;color:#fff}
.ic svg{width:17px;height:17px}
.item input[type="text"],.item input:not([type]),.item select,.item input[type="time"],.item input[type="date"]{background:transparent;border:0;text-align:right;font-size:17px;color:var(--muted);width:120px;padding:4px 0;font-family:var(--font-num)}
.item input[type="date"]{color:var(--trend);width:auto}
.item select{font-family:var(--font-ui);width:auto;direction:rtl}
.item input:focus{color:var(--fg);outline:none}
.item.action{color:var(--trend);justify-content:center;font-weight:500}
.item.danger{color:var(--danger);justify-content:center;font-weight:500}
.item .val{color:var(--muted);font-size:15px;text-align:right}
.tg{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.3,1.3,.5,1)}
.tg:checked{background:var(--trend)}
.tg:checked::after{transform:translateX(20px)}
.footer{text-align:center;font-size:12px;color:var(--muted);margin:6px 0 0}

/* buttons */
.btn{border-radius:14px;padding:14px 16px;font-weight:600;font-size:17px;background:var(--surface-2);color:var(--fg);text-align:center}
.btn.primary{background:var(--trend);color:var(--trend-ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}
.empty .btns .btn{flex:none}

/* empty */
.empty{align-items:center;text-align:center;padding:40px 20px;gap:14px}
.empty .ring{width:72px;height:72px;border-radius:50%;background:var(--trend-soft);color:var(--trend);display:grid;place-items:center}
.empty .ring svg{width:34px;height:34px}
.empty h2{margin:0;font-size:22px;font-weight:700}
.empty p{margin:0;color:var(--muted);max-width:32ch;font-size:15px;line-height:1.45}

/* tab bar: a floating glass bar with the two tabs, and the add button as its own glass circle beside it */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;justify-content:center;align-items:center;gap:12px;pointer-events:none}
body[data-tab="settings"] nav.tabs{display:none}
.glass{background:color-mix(in srgb,var(--surface) 72%,transparent);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);
  border:.5px solid color-mix(in srgb,var(--fg) 12%,transparent);box-shadow:0 8px 28px rgba(0,0,0,.22),inset 0 .5px 0 rgba(255,255,255,.08)}
.tabbar{position:relative;pointer-events:auto;display:flex;align-items:center;border-radius:30px;padding:5px;flex:1;max-width:270px}
/* soft pill behind the selected tab; slides between tabs once placed */
.tab-pill{position:absolute;left:0;top:5px;bottom:5px;width:0;border-radius:24px;background:color-mix(in srgb,var(--fg) 11%,transparent);pointer-events:none}
.tab-pill.ready{transition:transform .4s cubic-bezier(.3,1.25,.5,1),width .4s cubic-bezier(.3,1.25,.5,1)}
.tabbar [role="tab"]{position:relative;z-index:1;flex:1;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:24px;font-size:11px;font-weight:600;transition:color .2s}
.tabbar [role="tab"] svg{width:23px;height:23px}
.tabbar [role="tab"][aria-selected="true"]{color:var(--fg)}
.fab{pointer-events:auto;flex:none;width:60px;height:60px;border-radius:50%;color:var(--trend);display:grid;place-items:center;transition:transform .15s}
.fab:active{transform:scale(.88)}
.fab svg{width:28px;height:28px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .22s}
.scrim.closing{opacity:0;transition:opacity .22s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--sheet);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:6px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto;
  animation:up .34s cubic-bezier(.2,.9,.3,1);transition:transform .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line-strong);margin:4px auto 0;flex:none}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{margin:0;font-size:18px;font-weight:650}
.wbig input{font-family:var(--font-num);font-size:44px;font-weight:700;text-align:center;padding:12px;background:transparent;border:0;width:100%;min-width:0;outline:none}
.dial{display:flex;align-items:center;gap:10px;padding-top:6px}
.dial-mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.dial-mid input{font-family:var(--font-num);font-size:58px;font-weight:700;letter-spacing:-.03em;text-align:center;padding:4px 0;background:transparent;border:0;width:100%;min-width:0;outline:none;touch-action:none;caret-color:var(--trend)}
.dial-u{font-size:15px;font-weight:600;color:var(--muted);margin-top:-4px}
.step{width:56px;height:56px;border-radius:50%;background:var(--surface-2);font-size:28px;font-weight:500;flex:none;color:var(--trend);display:grid;place-items:center}
.step:active{background:var(--trend-soft)}
.ruler{display:block;width:100%;height:58px;margin-top:-4px;touch-action:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
.err{color:var(--danger);font-size:14px;margin:0}
.datebar{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:14px;padding:4px}
.dnav{width:44px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--trend)}
.dnav svg{width:20px;height:20px}
.dnav:disabled{color:var(--line-strong)}
.dlab{position:relative;flex:1;text-align:center;font-weight:650;font-size:17px}
.dlab input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.pad{display:grid;grid-template-columns:repeat(3,1fr);margin:0 -16px -4px;border-top:.5px solid var(--line);position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--sheet);padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-22px - env(safe-area-inset-bottom,0px))}
.pad button{height:54px;font-family:var(--font-num);font-size:27px;font-weight:600;text-align:center;border-right:.5px solid var(--line);border-bottom:.5px solid var(--line);display:grid;place-items:center}
.pad button:nth-child(3n){border-right:0}
.pad button:nth-last-child(-n+3){border-bottom:0}
.pad button:active{background:var(--surface-2)}
.pad svg{width:26px;height:26px}

/* celebration */
.celebrate{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:24px;animation:fade .25s}
.celebrate canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.cel-card{position:relative;background:var(--sheet);border-radius:26px;padding:28px 22px 20px;text-align:center;max-width:340px;width:100%;display:flex;flex-direction:column;gap:10px;align-items:center;animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
.cel-ring{width:72px;height:72px;border-radius:50%;background:var(--goal-soft);color:var(--goal);display:grid;place-items:center}
.cel-ring svg{width:34px;height:34px}
.cel-card h2{margin:4px 0 0;font-size:23px;font-weight:700}
.cel-card .num{font-size:40px;font-weight:700}
.cel-card p{margin:0 0 6px;color:var(--muted);font-size:15px}
.cel-card .btn{width:100%}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.sel{-webkit-user-select:text;user-select:text}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:15px;z-index:70;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast button{color:var(--trend);font-weight:700}
@media (prefers-reduced-motion:reduce){main.enter,.sheet,.cel-card,.scrim,.celebrate{animation:none}.lrow,.gbar>span,.tg::after,.tab-pill.ready,.tip{transition:none}}
</style>

<body data-tab="progress">
<div class="topbar" id="topbar"><div class="tb-inner"><div class="tb-left" id="tbLeft"></div><span class="tb-title" id="tbTitle">Progress</span><div class="tb-right" id="tbRight"></div></div></div>
<main id="view"></main>

<nav class="tabs">
  <div class="tabbar glass" role="tablist">
    <span class="tab-pill" aria-hidden="true"></span>
    <button role="tab" data-tab="progress" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>Progress</button>
    <button role="tab" data-tab="history" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4.5h11a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8.5h6"/></svg>History</button>
  </div>
    <button class="fab glass" id="addBtn" aria-label="Add weigh-in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</nav>

<script>
"use strict";
/* ---------- state ---------- */
const KEY = "trendline-scale-v1";
const NATIVE = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.store);
const DEFAULTS = { unit:"kg", goal:null, start:null, step:null, commit:null, goalSince:null, celebrated:null, smooth:0.1, theme:"auto", chartRange:90,
  healthRead:false, healthWrite:false, healthSince:null, healthFrom:null, healthIgnore:[], notifyWeigh:true, remind:false, remindTime:"07:30",
  lock:false, updateSeen:null, updateChecked:0 };
// Saved-data format. Bump SCHEMA and add MIGRATIONS[old] when the shape of saved data changes.
const SCHEMA = 3;
const DROPPED_SETTINGS = ["models", "actRead", "dayMode", "dayCutoff", "dayStarts", "sleepAsked", "cards", "cols", "reportMode", "height", "accent", "haptics"];
const MIGRATIONS = {
  // 1: data from before versioning. Nothing to change.
  // 2: the redesign keeps weight only, so food, activity and body composition go.
  2: d => {
    delete d.food; delete d.foodCache; delete d.activity;
    for (const e of d.entries || []){ delete e.fat; delete e.lean; }
    const s = d.settings || {};
    for (const k of DROPPED_SETTINGS) delete s[k];
    if (s.chartRange === 7) s.chartRange = 30;
  }
};
let S = { schema:SCHEMA, entries:[], settings:{...DEFAULTS} };

function upgrade(d){
  for (let v = d.schema || 1; v < SCHEMA; v++) if (MIGRATIONS[v]) MIGRATIONS[v](d);
  d.schema = SCHEMA;
  return d;
}
function normalize(){
  const s = S.settings;
  if (!Array.isArray(s.healthIgnore)) s.healthIgnore = [];
  if (!RANGES.some(r => r[0] === s.chartRange)) s.chartRange = 90;
}
function load(){
  let migrated = false;
  try{
    const raw = (NATIVE && typeof window.__NATIVE_STATE__ === "string") ? window.__NATIVE_STATE__ : localStorage.getItem(KEY);
    if (raw){
      const d = JSON.parse(raw); migrated = (d.schema || 1) < SCHEMA; upgrade(d);
      S.entries = Array.isArray(d.entries) ? d.entries : []; S.settings = {...DEFAULTS, ...(d.settings || {})};
    }
  }catch(e){}
  normalize(); sortEntries();
  if (migrated) save();
}
function save(){
  const json = JSON.stringify(S);
  if (NATIVE){ try{ window.webkit.messageHandlers.store.postMessage(json); }catch(e){} }
  try{ localStorage.setItem(KEY, json); }catch(e){}
}
function sortEntries(){ S.entries.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); }
function nativeCmd(cmd, data){ if (!NATIVE || !window.webkit.messageHandlers.native) return; try{ window.webkit.messageHandlers.native.postMessage(Object.assign({cmd}, data || {})); }catch(e){} }
function haptic(kind){ nativeCmd("haptic", { kind }); }

/* ---------- dates & units ---------- */
const DAY = 864e5;
const pad = n => String(n).padStart(2,"0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const localDate = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const dnum = s => { const [y,m,d] = s.split("-").map(Number); return Date.UTC(y,m-1,d)/DAY; };
const fromDnum = n => { const d = new Date(n*DAY); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONF = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const WDF = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const parts = s => { const [y,m,d] = s.split("-").map(Number); return { y, m, d, wd: new Date(Date.UTC(y,m-1,d)).getUTCDay() }; };
const fmtDate = s => { const p = parts(s); return `${p.d} ${MON[p.m-1]} ${p.y}`; };
const longDate = s => { const p = parts(s); return `${p.d} ${MONF[p.m-1]} ${p.y}`; };
const LB = 2.2046226218;
const U = () => S.settings.unit;
const toU = kg => U() === "lb" ? kg*LB : kg;
const fromU = v => U() === "lb" ? v/LB : v;
const fw = kg => kg == null || isNaN(kg) ? "—" : toU(kg).toFixed(1);
const fd = kg => { if (kg == null || isNaN(kg)) return "—"; const v = toU(kg); if (Math.abs(v) < 0.05) return "0.0"; return (v > 0 ? "+" : "−") + Math.abs(v).toFixed(1); };
const NUMFONT = getComputedStyle(document.documentElement).getPropertyValue("--font-num").trim() || "system-ui";

/* ---------- the math ---------- */
// Exponentially smoothed trend that respects gaps between weigh-ins.
const counts = e => !e.ignored && !(e.outlier && !e.keep);
function computeTrend(){
  const a = S.settings.smooth; let t = null, prev = null;
  return S.entries.filter(counts).map(e => {
    const n = dnum(e.date);
    if (t === null) t = e.kg; else { const f = 1 - Math.pow(1 - a, Math.max(1, n - prev)); t += f * (e.kg - t); }
    prev = n; return { ...e, n, trend: t };
  });
}
function trendAt(rows, n){
  if (!rows.length || n < rows[0].n) return null;
  if (n >= rows[rows.length-1].n) return rows[rows.length-1].trend;
  for (let i = 1; i < rows.length; i++) if (rows[i].n >= n){ const A = rows[i-1], B = rows[i]; return A.trend + (n - A.n)/((B.n - A.n) || 1)*(B.trend - A.trend); }
  return null;
}
// least-squares slope (kg/day) of the trend over the last `days` days
function slope(rows, days){
  if (rows.length < 2) return null;
  const end = rows[rows.length-1].n;
  const pts = rows.filter(r => r.n >= end - days);
  if (pts.length < 2 || pts[pts.length-1].n - pts[0].n < 6) return null;
  const mx = pts.reduce((s,p) => s + p.n, 0)/pts.length, my = pts.reduce((s,p) => s + p.trend, 0)/pts.length;
  let num = 0, den = 0; for (const p of pts){ num += (p.n-mx)*(p.trend-my); den += (p.n-mx)**2; }
  return den ? num/den : null;
}
// Change in trend over the last `days`, or null when a long gap makes the comparison meaningless.
function changeOver(rows, days){
  const last = rows[rows.length-1], target = last.n - days;
  if (rows[0].n > target) return null;
  let i0 = 0; for (let i = 0; i < rows.length; i++) if (rows[i].n <= target) i0 = i;
  for (let i = i0 + 1; i < rows.length; i++) if (rows[i].n - rows[i-1].n > 21) return null;
  const b = trendAt(rows, target); return b == null ? null : last.trend - b;
}
// Flags a weigh-in that is far from the trend (someone else on the scale, clothes, a big meal) until you confirm it.
function detectOutliers(){
  const a = S.settings.smooth; let t = null, prev = null, changed = false;
  for (const e of S.entries){
    if (e.ignored) continue;
    const n = dnum(e.date);
    if (t !== null && !e.keep && !e.reviewed){
      const lim = Math.max(2, t*0.025), recent = n - prev <= 7;
      const out = recent && Math.abs(e.kg - t) > lim;
      if (!!e.outlier !== out){ e.outlier = out; changed = true; }
      if (!out && dnum(todayStr()) - n > 3 && !e.reviewed){ e.reviewed = true; changed = true; }
    }
    if (e.outlier && !e.keep) continue;
    if (t === null) t = e.kg; else { const f = 1 - Math.pow(1 - a, Math.max(1, n - prev)); t += f*(e.kg - t); }
    prev = n;
  }
  return changed;
}
function startWeight(){ return S.settings.start ?? (S.entries[0] ? S.entries[0].kg : null); }
function goalDir(){ const g = S.settings.goal, st = startWeight(); if (g == null || st == null) return -1; return g < st ? -1 : 1; }
function tone(delta){ if (delta == null || Math.abs(delta) < 0.05) return "flat"; return Math.sign(delta) === goalDir() ? "good" : "bad"; }
const arrow = d => d == null || Math.abs(d) < 0.05 ? "→" : d > 0 ? "↑" : "↓";
function milestones(){
  const g = S.settings.goal, st = startWeight(); if (g == null || st == null) return [];
  const step = S.settings.step ?? (U() === "lb" ? 5/LB : 2); const dir = Math.sign(g - st) || -1; const out = [];
  for (let w = st + dir*step; (dir < 0 ? w > g + 0.01 : w < g - 0.01) && out.length < 200; w += dir*step) out.push(Math.round(w*1000)/1000);
  out.push(g); return out;
}
const goalReached = t => { const g = S.settings.goal; return g != null && (Math.abs(t - g) < 0.05 || (goalDir() < 0 ? t <= g : t >= g)); };
// Day the trend reaches the goal at `perDay`, or null when it isn't heading there.
function etaFor(perDay, left, lastN){
  if (!perDay || Math.sign(perDay) !== -Math.sign(left) || Math.abs(perDay) < 0.0005) return null;
  const d = Math.round(Math.abs(left/perDay));
  return d > 3650 ? { far:true } : { date: fromDnum(lastN + d), days: d };
}
const inTime = d => d < 60 ? `In ${d} day${d === 1 ? "" : "s"}` : d < 730 ? `In about ${Math.round(d/7)} weeks` : `In about ${Math.round(d/30.4)} months`;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const view = $("#view");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ICON = {
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="currentColor" aria-label="Apple Health"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>',
  scale:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 9.5a5 5 0 0 1 8 0M12 9.5l1.5-2"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  bksp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 5H20a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H8.5L3 12z"/><path d="M11.5 9.5l5 5M16.5 9.5l-5 5"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>'
};
const CHEV = ICON.chev, BKSP = ICON.bksp;
// Down, up or sideways arrow for a change in weight.
const arrowIcon = d => ICON.arrow.replace("<svg ", `<svg style="transform:rotate(${d == null || Math.abs(d) < 0.05 ? -90 : d > 0 ? 180 : 0}deg)" `);
// Line icons for settings rows, shown white on a coloured square.
const sv = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const SET_ICON = {
  goal: ICON.flag,
  start: sv('<circle cx="7" cy="12" r="2.5"/><path d="M10 12h9M15 8l4 4-4 4"/>'),
  steps: sv('<path d="M4 19h5v-5h5V9h6"/>'),
  calendar: sv('<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>'),
  scale: ICON.scale,
  wave: sv('<path d="M3 14c3-6 6-6 9 0s6 6 9 0"/>'),
  heart: ICON.heart.replace(' aria-label="Apple Health"', ""),
  save: sv('<path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 20h14"/>'),
  bell: sv('<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>'),
  refresh: sv('<path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/>'),
  clock: sv('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>'),
  folder: sv('<path d="M3.5 7a2 2 0 0 1 2-2H10l2 2h6.5a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>'),
  moon: sv('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'),
  lock: sv('<rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
  info: sv('<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/>'),
  tag: sv('<path d="M4 12V5a1 1 0 0 1 1-1h7l8 8-8 8z"/><circle cx="8.5" cy="8.5" r="1.3"/>')
};
const SET_COLOR = { goal:"var(--goal)", trend:"var(--trend)", health:"#d6606e", remind:"#c3902f", backup:"#557a9b", look:"#7b70a3", lock:"#5f6f66", about:"#8b918a" };
const ico = (name, color) => `<span class="ic" style="background:${SET_COLOR[color]}">${SET_ICON[name]}</span>`;

/* ---------- theme ---------- */
function applyTheme(){
  const root = document.documentElement, t = S.settings.theme;
  if (t === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", t);
  nativeCmd("theme", { mode: t });
}

/* ---------- native bridge ---------- */
let backupInfo = null;
window.__native = function(event, p){
  p = p || {};
  if (event === "health-samples") mergeHealth(p.samples || [], p.error, p.own || []);
  else if (event === "health-status"){ if (p.available === false){ S.settings.healthRead = false; S.settings.healthWrite = false; save(); toast("Apple Health is not available on this device."); if (tab === "settings") render(); } else syncHealth(true); }
  else if (event === "reminder-denied"){ S.settings.remind = false; save(); toast("Notifications are off for Trendline. Turn them on in iOS Settings."); if (tab === "settings") render(); }
  else if (event === "backup-info"){ const changed = JSON.stringify(p) !== JSON.stringify(backupInfo); backupInfo = p; if (changed && tab === "settings") render(); }
  else if (event === "foreground"){ syncHealth(false); checkUpdate(false); scheduleReminder(); if (tab !== "settings") render(); }
  else if (event === "toast") toast(p.text || "");
  else if (event === "http-result"){ const w = httpWait[p.id]; if (w){ delete httpWait[p.id]; p.error ? w.reject(new Error(p.error)) : w.resolve(p); } }
  else if (event === "lock-result"){
    if (p.ok){ S.settings.lock = !!p.enabled; save(); toast(p.enabled ? "Face ID lock is on" : "Face ID lock is off"); haptic("success"); }
    else toast(p.reason === "unavailable" ? "Set up Face ID or a passcode on this iPhone first." : "Face ID was not confirmed.");
    if (tab === "settings") render();
  }
  else if (event === "state"){
    try{
      const d = JSON.parse(p.json);
      if (d && Array.isArray(d.entries)) upgrade(d);
      if (d && Array.isArray(d.entries) && JSON.stringify(d) !== JSON.stringify(S)){
        S.entries = d.entries; S.settings = {...DEFAULTS, ...(d.settings || {})}; normalize(); sortEntries();
        if (!document.querySelector(".scrim")) render();
        checkCelebrate(false);
      }
    }catch(e){}
  }
};
function stamp(d){ return `${d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}, ${d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}`; }
function backupText(){
  if (!backupInfo || !backupInfo.last) return "No automatic backup yet. One is saved the next time something changes.";
  return `Last saved ${stamp(new Date(backupInfo.last))} · ${backupInfo.count} weekly cop${backupInfo.count === 1 ? "y" : "ies"} kept.`;
}
function folderText(){
  const b = backupInfo;
  if (!b) return "";
  if (!b.folder) return "Pick a folder in iCloud Drive. A copy goes there after every change, so your data survives a revoked certificate or deleting the app.";
  if (b.folderError) return "⚠︎ " + b.folderError;
  if (!b.folderLast) return "No copy yet.";
  const d = new Date(b.folderLast), old = Date.now() - d.getTime() > 7 * DAY;
  return `${old ? "⚠︎ " : ""}Last copy ${stamp(d)}`;
}

/* ---------- Apple Health ---------- */
function syncHealth(full){
  if (!NATIVE || !S.settings.healthRead) return;
  let since = (!full && S.settings.healthSince) ? fromDnum(dnum(S.settings.healthSince) - 7) : "2000-01-01";
  if (S.settings.healthFrom && since < S.settings.healthFrom) since = S.settings.healthFrom;
  nativeCmd("healthRead", { since });
}
let connectPending = false;
// samples: first weight of each day from other apps and scales. own: weights this app saved to Health.
function mergeHealth(samples, error, own){
  if (error){ toast("Could not read from Apple Health."); connectPending = false; return; }
  const ignore = new Set(S.settings.healthIgnore || []);
  let added = 0, changed = 0;
  // Weigh-ins this app saved to Health earlier but no longer has (after a reinstall or "Erase all data"): bring them back.
  // Days you deleted in the app are in the ignore list and stay deleted.
  const ownByDay = {};
  for (const [t, kg] of own || []){ const d = localDate(t); if (!ownByDay[d] || t > ownByDay[d].t) ownByDay[d] = { t, kg }; }
  for (const [d, w] of Object.entries(ownByDay)){
    if (ignore.has(d) || (S.settings.healthFrom && d < S.settings.healthFrom) || !(w.kg > 20 && w.kg < 400)) continue;
    if (S.entries.some(e => e.date === d) || samples.some(x => x.date === d && x.kg)) continue;
    S.entries.push({ id: "r" + d, date: d, kg: w.kg, note: "", t: w.t, restored: true }); added++;
  }
  for (const smp of samples){
    if (!smp || !smp.date || ignore.has(smp.date) || (S.settings.healthFrom && smp.date < S.settings.healthFrom)) continue;
    if (!(smp.kg > 20 && smp.kg < 400)) continue;
    let ex = S.entries.find(e => e.date === smp.date);
    if (!ex){ ex = { id: "h" + smp.date, date: smp.date, kg: smp.kg, note: "", src: "health" }; if (smp.t) ex.t = smp.t; S.entries.push(ex); added++; continue; }
    if (smp.t && !ex.t) ex.t = smp.t;

  const fresh = reached.filter(m => !done.has(m.toFixed(2)));

  if (!fresh.length){ if (S.settings.celebrated == null){ S.settings.celebrated = []; save(); } return; }

/* ---------- history ---------- */
function renderHistory(){

  const byMonth = new Map(); rows.forEach(r => { const k = r.date.slice(0, 7); if (!byMonth.has(k)) byMonth.set(k, []); byMonth.get(k).push(r); });
  let html = `<p class="dateline">${S.entries.length} weigh-in${S.entries.length > 1 ? "s" : ""}</p>`;
  [...byMonth.keys()].sort().reverse().forEach(k => {
    const [y, m] = k.split("-").map(Number);
    // trend change across the month: end of this month against the end of the previous one
    const inMonth = valid.filter(r => r.date.slice(0, 7) === k), before = valid.filter(r => r.date < k + "-01");
    const ch = inMonth.length ? inMonth[inMonth.length-1].trend - (before.length ? before[before.length-1].trend : inMonth[0].trend) : null;

    html += `<section class="card month"><div class="month-h"><h3>${MONF[m-1]} ${y}</h3>${chHtml}</div>

    byMonth.get(k).slice().reverse().forEach(r => {
      const p = parts(r.date);

      const wk = r.excluded || !valid.length || valid[0].n > r.n - 7 ? null : r.trend - trendAt(valid, r.n - 7);
      const bits = []; if (r.ignored) bits.push("Ignored, not counted"); else if (r.excluded) bits.push("Unusual, check it on Progress");
      if (r.note) bits.push(esc(r.note));
      const df = wk == null ? "—" : Math.abs(wk) < 0.05 ? "0.0" : `${wk < 0 ? "↓" : "↑"} ${Math.abs(toU(wk)).toFixed(1)}`;
      html += `<div class="swipe"><button class="del" data-del="${esc(r.id)}">Delete</button>

          <span class="w num">${fw(r.kg)}${r.src === "health" ? `<span class="hbadge" title="From Apple Health">${ICON.heart}</span>` : ""}</span>
          <span class="t num c">${r.excluded ? "—" : fw(r.trend)}</span>
          <span class="c"><span class="dfp num ${wk == null ? "" : tone(wk)}" aria-label="Trend change this week">${df}</span></span>
          ${bits.length ? `<span class="memo">${bits.join(" · ")}</span>` : ""}
        </button></div>${r.id === S.entries[0].id ? `<div class="started">You started!</div>` : ""}`;
    });
    html += `</section>`;
  });

  view.querySelectorAll(".lrow").forEach(b => b.onclick = () => {
    if (suppressClick) return;

}

let sw = null, swipeOpen = null, suppressClick = false;
function closeSwipe(){ if (swipeOpen){ swipeOpen.style.transform = ""; swipeOpen = null; } }
view.addEventListener("touchstart", ev => {
  const row = ev.target.closest(".lrow"); if (!row){ if (!ev.target.closest(".del")) closeSwipe(); return; }
  sw = { row, x: ev.touches[0].clientX, y: ev.touches[0].clientY, dx: 0, active: false, base: row === swipeOpen ? -88 : 0 };

function deleteEntry(entry){
  S.settings.healthIgnore = [...new Set([...S.settings.healthIgnore, entry.date])];
  if (entry.src !== "health" && S.settings.healthWrite) nativeCmd("healthDelete", { date: entry.date });
  S.entries = S.entries.filter(e => e !== entry); save(); haptic("warning"); swipeOpen = null; render(); scheduleReminder();
  toast("Weigh-in deleted", { label: "Undo", fn: () => {
    S.settings.healthIgnore = S.settings.healthIgnore.filter(d => d !== entry.date);
    if (entry.src !== "health" && S.settings.healthWrite) nativeCmd("healthWrite", { date: entry.date, kg: entry.kg });
    if (!S.entries.some(e => e.date === entry.date)) S.entries.push(entry);
    sortEntries(); save(); render(); scheduleReminder();
  }});
}

  ruler.addEventListener("touchmove", ev => {
    if (!rd) return; ev.preventDefault();
    const pos = clampU(rd.base - (ev.touches[0].clientX - rd.x)/PX*0.1), v = Math.round(pos*10)/10;
    if (v !== rd.last){ rd.last = v; w.value = v.toFixed(1); haptic("selection"); }
    drawRuler(pos);
  }, { passive:false });
  ruler.addEventListener("touchend", () => { if (rd){ rd = null; drawRuler(read()); } });
  const bump = d => { const v = read(); if (!isNaN(v)){ setVal(v + d); haptic("selection"); } };
  sh.querySelector("#em").onclick = () => bump(-0.1); sh.querySelector("#ep").onclick = () => bump(0.1);
  let drag = null;
  w.addEventListener("touchstart", ev => { drag = { x: ev.touches[0].clientX, y: ev.touches[0].clientY, base: isNaN(read()) ? startVal : read(), steps: 0, on: false }; }, { passive:true });
  w.addEventListener("touchmove", ev => {
    if (!drag) return;
    const dx = ev.touches[0].clientX - drag.x, dy = ev.touches[0].clientY - drag.y;
    if (!drag.on){ if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)){ drag.on = true; w.blur(); } else if (Math.abs(dy) > 8){ drag = null; return; } else return; }
    ev.preventDefault();
    const steps = Math.round(dx/14);
    if (steps !== drag.steps){ drag.steps = steps; setVal(drag.base + steps*0.1); haptic("selection"); }
  }, { passive:false });
  w.addEventListener("touchend", ev => { if (drag && drag.on) ev.preventDefault(); drag = null; });
  if (entry) sh.querySelector("#edel").onclick = () => { closeSheet(); deleteEntry(entry); };
  const submit = () => {
    const v = read(), date = sh.querySelector("#ed").value, note = sh.querySelector("#en").value.trim(), err = sh.querySelector("#ee");
    const kg = fromU(v);
    if (isNaN(v) || kg < 20 || kg > 400){ err.hidden = false; err.textContent = `Enter a weight between ${toU(20).toFixed(0)} and ${toU(400).toFixed(0)} ${U()}.`; haptic("warning"); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)){ err.hidden = false; err.textContent = "Pick a date."; return; }
    if (entry && entry.date !== date && S.settings.healthWrite) nativeCmd("healthDelete", { date: entry.date });
    if (entry) S.entries = S.entries.filter(e => e.id !== entry.id);
    const same = S.entries.find(e => e.date === date), kgR = Math.round(kg*1000)/1000;
    const when = date === todayStr() ? Date.now() : null;
    if (same){ same.kg = kgR; same.note = note || same.note || ""; delete same.src; if (!same.t && when) same.t = when; }
    else { const ne = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date, kg: kgR, note };
      if (entry && entry.date === date && entry.t) ne.t = entry.t; else if (when) ne.t = when;
      S.entries.push(ne); }
    { const mine = S.entries.find(x => x.date === date); if (mine){ delete mine.outlier; delete mine.keep; delete mine.reviewed; } }
    sortEntries(); detectOutliers(); save(); closeSheet(); haptic("success"); render();
    const flagged = S.entries.find(x => x.date === date && x.outlier);
    toast(flagged ? "Saved. This weigh-in looks unusual, check it on Progress." : same ? "Updated that day's weigh-in" : "Saved");
    if (S.settings.healthWrite) nativeCmd("healthWrite", { date, kg: kgR });
    scheduleReminder(); checkCelebrate(false);
  };
  sh.querySelector("#es").onclick = submit; sh.querySelector("#es2").onclick = submit;
  w.addEventListener("keydown", ev => { if (ev.key === "Enter"){ ev.preventDefault(); w.blur(); } });
}
function numberSheet({ title, intro, label, value, placeholder, onSave, onClear }){
  const sh = openSheet(`<div class="sheet-h"><button class="link" data-x>Cancel</button><h2>${title}</h2><span style="width:52px"></span></div>
    ${intro ? `<p class="note">${intro}</p>` : ""}
    <div class="wbig"><input id="nv" class="num" inputmode="decimal" autocomplete="off" value="${value ?? ""}" placeholder="${placeholder}" aria-label="${label}"></div>
    <div style="text-align:center;color:var(--muted);margin-top:-10px;font-weight:600">${label}</div>
    <p class="err" id="ne" hidden></p>
    <button class="btn primary" id="ns">Save</button>
    ${onClear && value != null && value !== "" ? `<button class="btn" id="nc">Remove</button>` : ""}`);
  const i = sh.querySelector("#nv"); setTimeout(() => { i.focus(); i.select(); }, 350);
  sh.querySelector("#ns").onclick = () => { const v = parseFloat(i.value.replace(",", ".")); if (isNaN(v) || v <= 0){ const e = sh.querySelector("#ne"); e.hidden = false; e.textContent = "Enter a number above zero."; haptic("warning"); return; } onSave(v); closeSheet(); haptic("success"); render(); };
  const c = sh.querySelector("#nc"); if (c) c.onclick = () => { onClear(); closeSheet(); render(); };
}
function openCommit(){
  numberSheet({ title: "Weekly commitment", intro: `The pace you plan to ${goalDir() < 0 ? "lose" : "gain"} each week. The prediction shows when it would get you to your goal.`,
    label: `${U()} per week`, value: S.settings.commit ? toU(S.settings.commit).toFixed(2) : "", placeholder: U() === "lb" ? "1.0" : "0.5",
    onSave: v => { S.settings.commit = fromU(v); save(); }, onClear: () => { S.settings.commit = null; save(); } });

function openGoalSheet(){
  const rows = computeTrend();
  numberSheet({ title: "Goal weight", intro: "Your trend weight is measured against this goal. Starting weight and milestones are in Settings.", label: U(),
    value: S.settings.goal != null ? toU(S.settings.goal).toFixed(1) : "", placeholder: rows.length ? fw(rows[rows.length-1].trend) : "70.0",

function setGoal(kg){
  const changed = kg !== S.settings.goal; S.settings.goal = kg;
  if (changed){ S.settings.goalSince = kg == null ? null : todayStr(); resetCelebrations(); }
  save();

/* ---------- updates ---------- */
const REPO = "husain-313/Weight-tracker";
let latestRelease = null;
const buildOf = s => { const m = String(s || "").match(/\((\d+)\)|build[- ](\d+)/i); return m ? +(m[1] || m[2]) : 0; };
async function checkUpdate(manual){
  if (!NATIVE) return;
  if (!manual && Date.now() - (S.settings.updateChecked || 0) < 6*3600e3) return;
  try{
    const r = await http({ url: `https://api.github.com/repos/${REPO}/releases/latest`, headers: { "Accept": "application/vnd.github+json", "User-Agent": "Trendline" } });
    S.settings.updateChecked = Date.now(); save();
    if (r.status !== 200){ if (manual) toast("Couldn't check for updates right now."); return; }
    const d = JSON.parse(r.body), asset = (d.assets || []).find(a => /\.ipa$/i.test(a.name));
    const mine = buildOf(window.__APP_VERSION__), theirs = buildOf(d.tag_name);
    latestRelease = { name: d.name || d.tag_name, build: theirs, notes: d.body || "", url: asset ? asset.browser_download_url : d.html_url, page: d.html_url };
    if (theirs > mine){ if (manual || S.settings.updateSeen !== theirs) openUpdate(); if (tab === "settings") render(); }
    else if (manual) toast("You have the latest version");
  }catch(e){ if (manual) toast("Couldn't check for updates right now."); }
}
function openUpdate(){
  const u = latestRelease; if (!u) return;
  S.settings.updateSeen = u.build; save(); haptic("light");
  const notes = u.notes.split(/\n+/).filter(l => l.trim() && !/^Unsigned IPA|^Built with/.test(l)).join("\n");
  const sh = openSheet(`<div class="sheet-h"><button class="link" data-x>Later</button><h2>Update available</h2><span style="width:52px"></span></div>
    <div class="empty" style="padding:6px 0;gap:8px;display:flex;flex-direction:column"><div class="ring">${ICON.scale}</div><h2 style="font-size:20px">${esc(u.name.replace(/\s*\(build \d+\)/i, ""))}</h2>
      <p class="lbl">You have ${esc(window.__APP_VERSION__ || "an older version")}</p></div>
    <p class="note sel" style="white-space:pre-line;color:var(--fg)">${esc(notes)}</p>
    <button class="btn primary" id="uDl">Download update</button>
    <button class="btn" id="uCp">Copy download link</button>
    <p class="note" style="font-size:13px">Then install it with Signulous like before, keeping the same bundle ID so your data stays.</p>`);
  sh.querySelector("#uDl").onclick = () => { nativeCmd("openURL", { url: u.url }); haptic("light"); };
  sh.querySelector("#uCp").onclick = () => { nativeCmd("copy", { text: u.url }); haptic("success"); toast("Link copied"); };
}
let httpSeq = 0;
const httpWait = {};
function http(req){
  return new Promise((resolve, reject) => {
    if (!NATIVE) return reject(new Error("This works in the iPhone app"));
    const id = ++httpSeq; httpWait[id] = { resolve, reject };
    nativeCmd("http", { id, method: req.method || "GET", url: req.url, headers: req.headers || {}, body: req.body });
    setTimeout(() => { if (httpWait[id]){ delete httpWait[id]; reject(new Error("timed out")); } }, 35000);
  });
}

/* ---------- settings ---------- */

  const inp = (ic, id, k, val, ph, h) => `<label class="item">${lab(ic, k, h)}<input id="${id}" class="num" inputmode="decimal" value="${val}" placeholder="${ph}"></label>`;
  let html = `<div class="group-t">Goal</div><div class="list">

      ${inp(["start", "goal"], "ss", "Starting weight", s.start == null ? "" : toU(s.start).toFixed(1), S.entries[0] ? fw(S.entries[0].kg) : U(), "Defaults to your first weigh-in")}
      ${inp(["steps", "goal"], "sm", "Milestone every", s.step == null ? "" : toU(s.step).toFixed(1), U() === "lb" ? "5.0" : "2.0")}

    </div>
    <div class="group-t">Weight & trend</div><div class="list">
      <label class="item">${lab(["scale", "trend"], "Units")}<select id="su"><option value="kg" ${s.unit === "kg" ? "selected" : ""}>Kilograms</option><option value="lb" ${s.unit === "lb" ? "selected" : ""}>Pounds</option></select></label>
      <label class="item">${lab(["wave", "trend"], "Trend smoothing", "Heavier smoothing ignores daily swings more but reacts slower")}
        <select id="sa"><option value="0.2" ${s.smooth == 0.2 ? "selected" : ""}>Light</option><option value="0.1" ${s.smooth == 0.1 ? "selected" : ""}>Standard</option><option value="0.05" ${s.smooth == 0.05 ? "selected" : ""}>Heavy</option></select></label>
    </div>`;
  if (NATIVE){
    html += `<div class="group-t">Apple Health</div><div class="list">
      ${tgl(["heart", "health"], "hr", s.healthRead, "Import weigh-ins", "Weight from your smart scale or other apps")}
      ${tgl(["save", "health"], "hw", s.healthWrite, "Save weigh-ins to Health", "Weights you log here are added to Apple Health")}
      ${s.healthRead ? `<label class="item">${lab(["calendar", "health"], "Import from", "Older readings in Apple Health are ignored")}<input type="date" id="hf" value="${s.healthFrom || ""}" max="${todayStr()}"></label>` : ""}
      ${s.healthRead ? tgl(["bell", "health"], "hn", s.notifyWeigh !== false, "Notify after each weigh-in", "Weight and trend as soon as your scale syncs") : ""}
      ${s.healthRead ? `<button class="item" id="hs">${lab(["refresh", "health"], "Check now")}<span class="val">${s.healthSince ? "Last " + fmtDate(s.healthSince) : "Not yet"}</span></button>` : ""}
    </div>
    <div class="group-t">Reminder</div><div class="list">
      ${tgl(["bell", "remind"], "rm", s.remind, "Remind me to weigh in", "Skipped on days you've already weighed in")}
      <label class="item">${lab(["clock", "remind"], "Time")}<input type="time" id="rt" value="${s.remindTime || "07:30"}" ${s.remind ? "" : "disabled"}></label>
    </div>`;
  }
  html += `<div class="group-t">Backup</div><div class="list">
      ${NATIVE ? `<button class="item" id="bf">${lab(["folder", "backup"], "Backup folder", esc(folderText()))}<span class="val" style="color:var(--${bk.folder && !bk.folderError ? "trend" : "muted"})">${bk.folder ? esc(bk.folder) : "Choose"}</span></button>
      <button class="item action" id="bn">Back up now</button>` : ""}
      <button class="item action" id="bx">Export backup</button>
      <button class="item action" id="bc">Export spreadsheet (CSV)</button>
      <button class="item action" id="bi">Restore from backup</button>
    </div>
    <p class="group-f">${NATIVE ? esc(backupText()) + " Automatic backups are in the Files app: On My iPhone › Trendline › Backups." : "Your data stays on this device. Export a backup now and then."}</p>
    ${NATIVE && bk.folder ? `<div class="list"><button class="item action" id="bfr">Stop copying to ${esc(bk.folder)}</button></div>` : ""}
    <div class="group-t">Appearance</div><div class="list">
      <label class="item">${lab(["moon", "look"], "Theme")}<select id="st"><option value="auto" ${s.theme === "auto" ? "selected" : ""}>Match iPhone</option><option value="light" ${s.theme === "light" ? "selected" : ""}>Light</option><option value="dark" ${s.theme === "dark" ? "selected" : ""}>Dark</option></select></label>
    </div>
    ${NATIVE ? `<div class="group-t">Privacy</div><div class="list">${tgl(["lock", "lock"], "lk", s.lock, "Lock with Face ID", "Asks for Face ID or your passcode when you open the app")}</div>` : ""}
    ${NATIVE ? `<div class="group-t">About</div><div class="list">
      <div class="item">${lab(["info", "about"], "Version")}<span class="val">${esc(window.__APP_VERSION__ || "—")}</span></div>
      ${bk.bundle ? `<div class="item">${lab(["tag", "about"], "Bundle ID")}<span class="val" style="font-size:13px">${esc(bk.bundle)}</span></div>` : ""}
      ${latestRelease && latestRelease.build > buildOf(window.__APP_VERSION__) ? `<button class="item action" id="upOpen">Update to ${esc(latestRelease.name.replace(/\s*\(build \d+\)/i, ""))}</button>` : ""}
      <button class="item action" id="upChk">Check for updates</button></div>` : ""}
    <div class="list" style="margin-top:8px"><button class="item danger" id="bd">Erase all data</button></div>
    <p class="footer">Trendline${window.__APP_VERSION__ ? " " + esc(window.__APP_VERSION__) : ""}</p>`;
  view.innerHTML = html;

  const num = (id, cb) => $(id).addEventListener("change", e => { const raw = e.target.value.trim().replace(",", "."), v = raw === "" ? null : parseFloat(raw); if (raw !== "" && (isNaN(v) || v <= 0)){ toast("Enter a number above zero"); return; } cb(v); save(); haptic("light"); toast("Saved"); });
  num("#sg", v => setGoal(v == null ? null : fromU(v)));
  num("#ss", v => { S.settings.start = v == null ? null : fromU(v); resetCelebrations(); });
  num("#sm", v => { S.settings.step = v == null ? null : fromU(v); resetCelebrations(); });
  num("#sc", v => S.settings.commit = v == null ? null : fromU(v));
  $("#su").onchange = e => { S.settings.unit = e.target.value; save(); haptic("light"); render(); };
  $("#sa").onchange = e => { S.settings.smooth = parseFloat(e.target.value); save(); resetCelebrations(); haptic("light"); };
  $("#st").onchange = e => { S.settings.theme = e.target.value; save(); applyTheme(); render(); };
  $("#bx").onclick = () => exportFile(`trendline-backup-${todayStr()}.json`, JSON.stringify(S, null, 1), "application/json");
  $("#bc").onclick = () => { const rows = computeTrend(); exportFile(`trendline-${todayStr()}.csv`, "Date,Weight (kg),Trend (kg),Note\n" + rows.map(r => `${r.date},${r.kg.toFixed(2)},${r.trend.toFixed(2)},"${(r.note || "").replace(/"/g, '""')}"`).join("\n"), "text/csv"); };
  $("#bi").onclick = pickRestore;
  const bd = $("#bd"); let armed = false;
  bd.onclick = () => { if (!armed){ armed = true; bd.textContent = "Tap again to erase everything"; haptic("warning"); return; }

    const hn = $("#hn"); if (hn) hn.onchange = e => { S.settings.notifyWeigh = e.target.checked; save(); haptic("light"); if (e.target.checked) nativeCmd("notifyAuth"); };
    const hf = $("#hf"); if (hf) hf.onchange = e => {
      const v = e.target.value; if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;

      const before = S.entries.length; S.entries = S.entries.filter(x => !(x.src === "health" && x.date < v)); const removed = before - S.entries.length;
      S.settings.healthIgnore = S.settings.healthIgnore.filter(d => d >= v);

}

/* ---------- backup ---------- */
function exportFile(name, text, type){
  haptic("light");
  if (NATIVE && window.webkit.messageHandlers.share){ window.webkit.messageHandlers.share.postMessage({ name, text }); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function pickRestore(){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async () => { const f = inp.files[0]; if (!f) return; restoreBackup(await f.text()); };
  inp.click();
}
function restoreBackup(text){
  let d; try{ d = JSON.parse(text); }catch(e){ d = null; }
  if (!d || !Array.isArray(d.entries)){ toast("That file isn't a Trendline backup."); haptic("warning"); return; }
  if ((d.schema || 1) > SCHEMA){ toast("This backup is from a newer Trendline. Update the app first."); haptic("warning"); return; }
  upgrade(d);
  let added = 0, updated = 0;
  for (const e of d.entries){
    if (!e || !/^\d{4}-\d{2}-\d{2}$/.test(e.date) || !(e.kg > 20 && e.kg < 400)) continue;
    const ex = S.entries.find(x => x.date === e.date);
    if (ex){ Object.assign(ex, e, { id: ex.id }); updated++; } else { S.entries.push({ ...e, id: e.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 7) }); added++; }
  }
  if (d.settings){ const keep = { lock: S.settings.lock }; S.settings = { ...DEFAULTS, ...d.settings, ...keep }; }
  normalize(); sortEntries(); save(); applyTheme(); scheduleReminder(); checkCelebrate(true); render(); haptic("success");
  toast(`Restored: ${added} new, ${updated} updated`);
}
function loadDemo(){
  const end = dnum(todayStr()); let w = 86;
  for (let i = 120; i >= 0; i--){ if (Math.random() < 0.15) continue; w += -0.06 + (Math.random() - .5)*0.15; const noise = (Math.random() - .5)*1.2;
    S.entries.push({ id: "demo" + i, date: fromDnum(end - i), kg: Math.round((w + noise)*10)/10, note: i === 60 ? "Demo data" : "" }); }
  S.settings.goal = 78; S.settings.goalSince = fromDnum(end - 120); S.settings.commit = 0.5;
  sortEntries(); resetCelebrations(); save(); render(true); toast("Demo data loaded. Erase it in Settings.");
}

/* ---------- toast ---------- */
let toastT;
function toast(msg, action){
  let t = $(".toast"); if (!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ""}`; t.hidden = false;
  if (action) t.querySelector("button").onclick = () => { t.hidden = true; action.fn(); };
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, action ? 4500 : 2600);
}

/* ---------- boot ---------- */
load(); applyTheme(); if (detectOutliers()) save();
syncTabbar(); render();
if (NATIVE){ syncHealth(false); scheduleReminder(); setTimeout(() => checkUpdate(false), 1500); }
checkCelebrate(S.settings.celebrated == null);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { applyTheme(); render(); });
