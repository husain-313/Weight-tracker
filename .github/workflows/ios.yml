name: Build iOS app (IPA)

on:
  push:
    branches: [main, update-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project TrendlineScale.xcodeproj -scheme TrendlineScale \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TrendlineScale.app Payload/
          # ad-hoc sign so signing tools keep the Apple Health permission
          codesign --force --sign - --entitlements TrendlineScale.entitlements Payload/TrendlineScale.app
          codesign -d --entitlements - Payload/TrendlineScale.app || true
          zip -qry TrendlineScale.ipa Payload
          ls -lh TrendlineScale.ipa

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrendlineScale-ipa
          path: ios/TrendlineScale.ipa

      # Other branches stop at the build artifact, so test builds never show up as an in-app update.
      - name: Write release notes
        if: github.ref == 'refs/heads/main'
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          XC=$(xcodebuild -version | head -1)
          if [ -d "$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks/FoundationModels.framework" ]; then FM=yes; else FM=no; fi
          cat > ios/release-notes.md <<NOTES
          Version 1.8:
          - Backup folder: pick a folder in iCloud Drive and a copy is saved there after every change, so your data survives a revoked certificate or deleting the app
          - Back up now, with the time of the last copy shown in Settings
          - Settings › About shows the bundle ID and whether widget data sharing (App Group) works with your signing
          - Saved data now carries a format version, and backups from a newer version are refused instead of half-restored
          Unsigned IPA. Install with Sideloadly, AltStore or a similar signing tool.

          Built with $XC, iOS SDK $SDK. Apple Intelligence offline fallback included: $FM.
          NOTES

      - name: Publish release with the IPA
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Trendline 1.8 (build ${{ github.run_number }})
          body_path: ios/release-notes.md
          files: ios/TrendlineScale.ipa
