name: Build iOS app (IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project TrendlineScale.xcodeproj -scheme TrendlineScale \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TrendlineScale.app Payload/
          # ad-hoc sign so signing tools keep the Apple Health permission
          codesign --force --sign - --entitlements TrendlineScale.entitlements Payload/TrendlineScale.app
          codesign -d --entitlements - Payload/TrendlineScale.app || true
          zip -qry TrendlineScale.ipa Payload
          ls -lh TrendlineScale.ipa

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrendlineScale-ipa
          path: ios/TrendlineScale.ipa

      - name: Write release notes
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          XC=$(xcodebuild -version | head -1)
          if [ -d "$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks/FoundationModels.framework" ]; then FM=yes; else FM=no; fi
          cat > ios/release-notes.md <<NOTES
          Version 1.7.1:
          - Connect Apple Health now shows that it's connected and when it's importing from
          - Weigh-ins this app saved to Health earlier come back after a reinstall or erase (days you deleted stay deleted)
          Unsigned IPA. Install with Sideloadly, AltStore or a similar signing tool.

          Built with $XC, iOS SDK $SDK. Apple Intelligence offline fallback included: $FM.
          NOTES

      - name: Publish release with the IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Trendline 1.7.1 (build ${{ github.run_number }})
          body_path: ios/release-notes.md
          files: ios/TrendlineScale.ipa
